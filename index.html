<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1F6FD0">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SCIENCE UP!">
<title>SCIENCE UP! 中学理科</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F2F6FC;--panel:#FFFFFF;--panel2:#EDF3FB;
    --primary:#1F6FD0;--primary-dark:#17559E;--accent:#E0921A;
    --danger:#E03B50;--text:#14203A;--sub:#6B7C93;--border:#DCE5F0;
    --shadow:0 8px 28px rgba(31,111,208,.10);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Noto Sans JP',system-ui,sans-serif;color:var(--text);
    background:radial-gradient(circle at 20% 0%,#DEEAF8 0%,#F2F6FC 55%);min-height:100dvh;display:flex;justify-content:center}
  .app{width:100%;max-width:480px;min-height:100dvh;display:flex;flex-direction:column;position:relative}
  .topbar{padding:18px 20px 12px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;
    background:linear-gradient(180deg,#F2F6FC 70%,rgba(242,246,252,0))}
  .brand .logo{font-family:'Poppins';font-weight:800;font-size:23px;letter-spacing:-.5px;color:var(--primary)}
  .brand .logo span{color:var(--accent)}
  .brand .sub{font-size:11px;color:var(--sub);font-weight:500;margin-top:2px}
  .rankpill{background:var(--panel2);border:1px solid var(--border);border-radius:999px;padding:7px 14px;font-size:12px;font-weight:800;color:var(--accent)}
  .screen{flex:1;overflow-y:auto;padding:6px 20px 40px;-webkit-overflow-scrolling:touch}
  .statcard{background:var(--panel);border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:var(--shadow);margin-bottom:16px;display:flex;align-items:center;gap:18px}
  .ring{position:relative;width:92px;height:92px;flex:0 0 auto}
  .ring svg{transform:rotate(-90deg)}
  .ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring .in b{font-family:'Poppins';font-size:23px;font-weight:800;color:var(--primary);line-height:1}
  .ring .in small{font-size:9px;color:var(--sub);font-weight:600;margin-top:2px}
  .stinfo h2{font-size:15px;font-weight:900;margin-bottom:8px}
  .stinfo .row{display:flex;gap:16px}
  .stinfo .row div{font-size:11px;color:var(--sub);font-weight:600}
  .stinfo .row b{display:block;font-family:'Poppins';font-size:19px;color:var(--text);font-weight:700}
  .daily{display:flex;align-items:center;gap:13px;border-radius:20px;padding:15px 17px;margin-bottom:16px;cursor:pointer;
    background:linear-gradient(135deg,var(--primary-dark) 0%,var(--primary) 100%);color:#FFFFFF;box-shadow:0 6px 20px rgba(0,0,0,.13);transition:.15s}
  .daily:active{transform:scale(.985)}
  .daily.done{background:linear-gradient(135deg,#12A98A 0%,#3BB273 100%);color:#FFFFFF}
  .daily .dic{width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.2);
    display:flex;align-items:center;justify-content:center;font-size:22px;flex:0 0 auto}
  .daily .dbd{flex:1;min-width:0}
  .daily .dbd h3{font-size:16px;font-weight:900;letter-spacing:.2px;line-height:1.3}
  .daily .dbd p{font-size:11px;font-weight:600;opacity:.88;margin-top:3px;line-height:1.45}
  .daily .dbar{height:5px;border-radius:99px;background:rgba(255,255,255,.3);margin-top:8px;overflow:hidden}
  .daily .dbar i{display:block;height:100%;background:currentColor;border-radius:99px}
  .daily .dgo{font-size:12px;font-weight:800;background:rgba(255,255,255,.22);
    padding:8px 12px;border-radius:999px;flex:0 0 auto;white-space:nowrap}
  .ansbox{margin-top:16px;border:2px solid var(--border);border-radius:14px;padding:14px 16px;
    display:flex;align-items:center;justify-content:center;gap:8px;background:var(--panel2);min-height:60px}
  .ansbox .v{font-family:'Poppins';font-size:28px;font-weight:800;color:var(--text);letter-spacing:1px;min-width:20px;text-align:right}
  .ansbox .u{font-size:15px;font-weight:800;color:var(--sub)}
  .ansbox.ok{border-color:var(--primary);background:#E8F4EC}
  .ansbox.ng{border-color:var(--danger);background:#FDECEE}
  .cursor{display:inline-block;width:2px;height:24px;background:var(--primary);vertical-align:-4px;animation:bl 1s step-end infinite}
  @keyframes bl{50%{opacity:0}}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
  .pad button{padding:16px 0;border-radius:14px;border:1.5px solid var(--border);background:var(--panel);
    font-family:'Poppins';font-size:20px;font-weight:800;color:var(--text);cursor:pointer}
  .pad button:active{transform:scale(.96)}
  .pad button.fn{background:var(--panel2);font-size:17px}
  .catrow{display:flex;align-items:center;font-size:12px;font-weight:700;padding:7px 0;border-bottom:1px solid var(--border)}
  .catrow:last-child{border:0}
  .catrow .cn{flex:0 0 auto;max-width:52%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .catbar{height:6px;border-radius:99px;background:var(--border);overflow:hidden;flex:1;margin:0 10px}
  .catbar i{display:block;height:100%;border-radius:99px;background:var(--primary)}
  .catbar i.bad{background:var(--danger)}
  .catbar i.mid{background:var(--accent)}
  .catrow .cv{font-family:'Poppins';flex:0 0 auto;color:var(--sub)}
  .label{font-size:12px;font-weight:800;color:var(--sub);margin:10px 2px 10px;letter-spacing:.3px}
  .lvrow{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:6px}
  .lvbtn{background:var(--panel);border:1.5px solid var(--border);border-radius:14px;padding:12px 6px;text-align:center;cursor:pointer;transition:.15s}
  .lvbtn:active{transform:scale(.97)}
  .lvbtn .n{font-size:13px;font-weight:900;display:block}
  .lvbtn .d{font-size:9px;color:var(--sub);font-weight:600;margin-top:3px;display:block}
  .lvbtn.on{background:var(--primary);border-color:var(--primary);color:#FFFFFF}
  .lvbtn.on .d{color:rgba(8,32,26,.7)}
  .fields{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .fbtn{background:var(--panel);border:1.5px solid var(--border);border-radius:15px;padding:14px;cursor:pointer;transition:.15s;text-align:left}
  .fbtn:active{transform:scale(.98)}
  .fbtn .ic{font-size:20px}
  .fbtn .n{font-size:13px;font-weight:800;margin-top:5px}
  .fbtn .m{font-size:10px;color:var(--sub);font-weight:600;margin-top:3px}
  .fbtn .bar{height:4px;background:var(--border);border-radius:99px;margin-top:8px;overflow:hidden}
  .fbtn .bar i{display:block;height:100%;background:var(--primary);border-radius:99px}
  .btn{border:none;border-radius:14px;font-family:inherit;font-weight:800;font-size:15px;padding:15px;cursor:pointer;transition:.15s;width:100%}
  .btn:active{transform:scale(.98)}
  .btn-primary{background:var(--primary);color:#FFFFFF}
  .btn-ghost{background:var(--panel);color:var(--primary);border:1.5px solid var(--border)}
  .btn-accent{background:var(--accent);color:#6B4A00}
  .back{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--sub);font-weight:700;font-size:14px;cursor:pointer;padding:6px 2px;margin-bottom:6px;font-family:inherit}
  .qhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .qhead .left{display:flex;align-items:center;gap:10px}
  .qhead h2{font-size:16px;font-weight:900}
  .timer{font-family:'Poppins';font-weight:800;font-size:20px;color:var(--accent)}
  .timer.warn{color:var(--danger)}
  .combo{font-family:'Poppins';font-weight:800;font-size:13px;color:var(--accent)}
  .bar-top{height:6px;background:var(--border);border-radius:99px;overflow:hidden;margin-bottom:16px}
  .bar-top i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .3s}
  .qcard{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:22px 18px;box-shadow:var(--shadow);margin-bottom:14px}
  .qmeta{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .tagf{font-size:10px;font-weight:800;color:var(--primary);letter-spacing:.4px}
  .taglv{font-size:9px;padding:3px 8px;border-radius:7px;font-weight:800}
  .taglv.easy{background:#E3EEFA;color:#1F6FD0}
  .taglv.std{background:#FFF6E2;color:var(--accent)}
  .taglv.hard{background:#FFE8EC;color:var(--danger)}
  .taglv.ibo{background:#F0E6FA;color:#7A3FC4}
  .lvbtn .n{font-size:12px}
  .qtext{font-size:17px;font-weight:700;line-height:1.55}
  .choices{display:grid;gap:9px}
  .choice{background:var(--panel);border:1.5px solid var(--border);border-radius:14px;padding:14px 16px;font-family:inherit;font-size:15px;font-weight:700;
    color:var(--text);cursor:pointer;text-align:left;transition:.12s;line-height:1.45}
  .choice:active{transform:scale(.99)}
  .choice.correct{background:var(--primary);border-color:var(--primary);color:#FFFFFF}
  .choice.wrong{background:var(--danger);border-color:var(--danger);color:#7A0012}
  .choice.dim{opacity:.4}
  .exp{border-radius:14px;padding:15px;margin-top:12px;font-size:13px;line-height:1.65;background:var(--panel2);border:1px solid var(--border)}
  .exp b{color:var(--primary)}
  .result{text-align:center;padding:26px 10px}
  .result .rank{font-family:'Poppins';font-size:62px;font-weight:800;line-height:1;color:var(--accent)}
  .result .emoji{font-size:48px;margin-bottom:4px}
  .result .big{font-family:'Poppins';font-size:44px;font-weight:800;color:var(--primary);line-height:1;margin-top:6px}
  .result h2{font-size:18px;font-weight:900;margin:10px 0 4px}
  .result p{color:var(--sub);font-weight:600;font-size:13px;margin-bottom:6px}
  .misslist{text-align:left;background:var(--panel);border:1px solid var(--border);border-radius:15px;padding:4px;margin:14px 0;max-height:260px;overflow-y:auto}
  .misslist .r{padding:12px 14px;border-bottom:1px solid var(--border);font-size:13px;line-height:1.5}
  .misslist .r:last-child{border:none}
  .misslist .r .q{font-weight:700;margin-bottom:4px}
  .misslist .r .a{color:var(--primary);font-weight:700;font-size:12px}
  .lvstat{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .lvstat:last-child{margin-bottom:0}
  .lvstat .ln{font-size:10px;font-weight:800;width:50px;flex:0 0 auto}
  .lvstat .ln.lv-easy{color:#1F6FD0}
  .lvstat .ln.lv-std{color:var(--accent)}
  .lvstat .ln.lv-hard{color:var(--danger)}
  .lvstat .ln.lv-ibo{color:#7A3FC4}
  .lvstat .lb{flex:1;height:6px;background:var(--border);border-radius:99px;overflow:hidden}
  .lvstat .lb i{display:block;height:100%;border-radius:99px}
  .lvstat .lb i.lv-easy{background:#1F6FD0}
  .lvstat .lb i.lv-std{background:var(--accent)}
  .lvstat .lb i.lv-hard{background:var(--danger)}
  .lvstat .lb i.lv-ibo{background:#7A3FC4}
  .lvstat .lnum{font-family:'Poppins';font-size:10px;font-weight:700;color:var(--sub);width:48px;text-align:right;flex:0 0 auto}
  .lvstat .lrate{font-family:'Poppins';font-size:10px;font-weight:800;width:34px;text-align:right;flex:0 0 auto}
  .ach-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .achb{background:var(--panel);border:1.5px solid var(--border);border-radius:12px;padding:9px 8px;opacity:.5}
  .achb.got{opacity:1;border-color:var(--accent);background:#FFF6E2}
  .achb .an{font-size:10px;font-weight:800;line-height:1.3}
  .achb .ad{font-size:8px;color:var(--sub);font-weight:600;margin-top:3px;line-height:1.3}
    .evr{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:11px 13px;margin-bottom:7px;opacity:.45}
  .evr.got{opacity:1}
  .evr.cur{border-color:var(--accent);background:#FFF6E2;box-shadow:0 0 0 1.5px var(--accent) inset}
  .evr .evn{font-family:'Poppins';font-size:11px;font-weight:800;color:var(--sub);width:20px;flex:0 0 auto;text-align:right}
  .evr .eve{font-size:22px;flex:0 0 auto}
  .evr .evb{flex:1;min-width:0}
  .evr .evt{font-size:13px;font-weight:800;line-height:1.35}
  .evr .evd{font-family:'Poppins';font-size:10px;color:var(--sub);font-weight:700;margin-top:2px}
  .evr.cur .evd{color:var(--accent)}
  .zkr{display:flex;gap:12px;align-items:flex-start;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:8px;opacity:.55}
  .zkr.got{opacity:1}
  .zke{font-size:26px;flex:0 0 auto}
  .zkb{flex:1}
  .zkn{font-size:13px;font-weight:900}
  .zkd{font-size:11px;color:var(--sub);font-weight:600;line-height:1.5;margin-top:3px}
  .zktag{font-size:8px;padding:2px 7px;border-radius:6px;font-weight:800;vertical-align:1px}
  .dupn{font-family:Poppins;font-size:10px;font-weight:800;color:var(--accent);margin-left:2px}
  .zktag.N{background:#DCE5F0;color:#6B7C93}
  .zktag.R{background:#E3EEFA;color:#1F6FD0}
  .zktag.SR{background:#FFF1D6;color:var(--accent)}
  .zktag.H{background:#E9ECFF;color:#4A57C4}
  .row2{display:flex;gap:10px}
  .row2 .btn{flex:1}
  .help{font-size:11px;color:var(--sub);line-height:1.6;margin-top:8px}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--panel2);border:1px solid var(--border);color:var(--text);
    padding:12px 22px;border-radius:999px;font-size:13px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;z-index:50}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .pop{position:fixed;inset:0;pointer-events:none;z-index:40}
  .pop span{position:absolute;left:50%;top:45%;font-size:24px;animation:fly .8s ease-out forwards}
  @keyframes fly{0%{opacity:1;transform:translate(0,0) scale(.5)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.2)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand"><div class="logo">SCIENCE <span>UP!</span></div><div class="sub">中学理科 / 中1〜高校受験</div></div>
    <div class="rankpill" id="rankPill">総合 --</div>
  </div>
  <div id="updBar" style="display:none;align-items:center;gap:10px;background:var(--accent);color:#1A1400;padding:10px 14px;border-radius:12px;margin:0 0 12px;font-size:13px;font-weight:700">
    <b style="flex:1">新しいバージョンがあります</b>
    <button onclick="forceUpdate()" style="background:#1A1400;color:var(--accent);border:0;border-radius:8px;padding:7px 12px;font-weight:800;font-size:12px">更新する</button>
  </div>
  <div style="display:none">
  </div>
  <div class="screen" id="screen"></div>
</div>
<div class="toast" id="toast"></div>
<script>
const STORE_KEY='scienceup_v1';
const OLD_KEYS=['scienceup_tomoaki_v1','sciquest_tomoaki_v1'];
try{ if(!localStorage.getItem(STORE_KEY)){
  for(const k of OLD_KEYS){const o=localStorage.getItem(k); if(o){localStorage.setItem(STORE_KEY,o);break;}}
} }catch(e){}
let mem=null;
const FIELDS=[
  ['phys','物理（光・音・力・電気）'],
  ['chem','化学（物質・化学変化）'],
  ['bio','生物（植物・動物・遺伝）'],
  ['earth','地学（大地・天気・天体）']
];
const Q=[
  {id:'p_e1',f:'phys',lv:'easy',q:'光が鏡ではね返るとき、入射角と反射角の関係はどれか。',ch:['入射角が大きい','反射角が大きい','等しい','光の色による'],a:2,ex:'反射の法則。入射角＝反射角がつねに成り立つ。角度は鏡の面ではなく、面に垂直な線（法線）から測る。'},
  {id:'p_e2',f:'phys',lv:'easy',q:'光が空気中から水中へ進むとき、境界面で起こる現象はどれか。',ch:['反射のみ','屈折して境界面から遠ざかる','屈折して境界面に近づく（法線に近づく）','まっすぐ進む'],a:2,ex:'空気→水のように光の速さが遅くなる物質へ入ると、光は法線に近づくように曲がる。逆に水→空気では法線から遠ざかる。'},
  {id:'p_e3',f:'phys',lv:'easy',q:'凸レンズで、焦点距離の2倍の位置に物体を置いたときにできる像はどれか。',ch:['物体と同じ大きさの実像','物体より大きい実像','物体より小さい実像','虚像'],a:0,ex:'2焦点距離の位置では、反対側の2焦点距離の位置に同じ大きさの倒立実像ができる。'},
  {id:'p_e4',f:'phys',lv:'easy',q:'音の高さを決めるものはどれか。',ch:['振幅','振動数','音源の大きさ','空気の温度'],a:1,ex:'振動数（1秒間の振動回数、単位Hz）が大きいほど高い音になる。振幅は音の大きさを決める。'},
  {id:'p_e5',f:'phys',lv:'easy',q:'音が伝わらないのはどこか。',ch:['空気中','水中','金属中','真空中'],a:3,ex:'音は物質の振動が伝わる波なので、物質のない真空では伝わらない。光は真空でも伝わる。'},
  {id:'p_e6',f:'phys',lv:'easy',q:'2力がつり合う条件として正しくないものはどれか。',ch:['大きさが等しい','向きが反対','一直線上にある','同じ向きである'],a:3,ex:'つり合いの3条件は「大きさが等しい」「向きが逆」「同一直線上」。同じ向きでは打ち消し合わない。'},
  {id:'p_e7',f:'phys',lv:'easy',q:'質量100gの物体にはたらく重力の大きさはおよそ何Nか。',ch:['0.1N','1N','10N','100N'],a:1,ex:'100g＝0.1kgで、重力はおよそ1N。質量1kgあたり約10Nとして計算する。'},
  {id:'p_e8',f:'phys',lv:'easy',q:'圧力の求め方として正しいものはどれか。',ch:['力÷面積','力×面積','面積÷力','力＋面積'],a:0,ex:'圧力[Pa]＝力[N]÷面積[m2]。同じ力でも接する面積が小さいほど圧力は大きい。'},
  {id:'p_e9',f:'phys',lv:'easy',q:'回路を流れる電流の大きさを測るとき、電流計のつなぎ方はどれか。',ch:['並列につなぐ','直列につなぐ','どちらでもよい','電源に直接つなぐ'],a:1,ex:'電流計は測りたい部分と直列につなぐ。電圧計は並列につなぐ。'},
  {id:'p_e10',f:'phys',lv:'easy',q:'オームの法則を表す式はどれか。',ch:['V=IR','V=I÷R','I=VR','R=VI'],a:0,ex:'電圧V[V]＝電流I[A]×抵抗R[Ω]。変形するとI=V/R、R=V/I。'},
  {id:'p_e11',f:'phys',lv:'easy',q:'直列回路で、各部分を流れる電流について正しいものはどれか。',ch:['分かれるので場所によって違う','どこでも同じ','電源に近いほど大きい','抵抗が大きいほど大きい'],a:1,ex:'直列回路では電流の通り道が1本なので、どこでも電流は同じ。電圧は各抵抗に分かれる。'},
  {id:'p_e12',f:'phys',lv:'easy',q:'並列回路の全体の抵抗について正しいものはどれか。',ch:['各抵抗の和になる','どの抵抗よりも小さくなる','いちばん大きい抵抗と同じ','抵抗は関係ない'],a:1,ex:'並列では電流の通り道が増えるため、全体の抵抗はどの抵抗よりも小さくなる。'},
  {id:'p_e13',f:'phys',lv:'easy',q:'電力の単位はどれか。',ch:['J（ジュール）','W（ワット）','A（アンペア）','Ω（オーム）'],a:1,ex:'電力[W]＝電圧[V]×電流[A]。電力量[J]＝電力[W]×時間[s]。'},
  {id:'p_e14',f:'phys',lv:'easy',q:'磁界の向きを示すのは方位磁針のどちらの極か。',ch:['N極が指す向き','S極が指す向き','どちらでもよい','磁界に向きはない'],a:0,ex:'磁界の向きは、方位磁針のN極が指す向きと決められている。'},
  {id:'p_s1',f:'phys',lv:'std',q:'物体が等速直線運動をしているとき、その物体にはたらく力はどうなっているか。',ch:['力ははたらいていないか、つり合っている','進む向きに力がはたらき続けている','だんだん大きくなる','重力だけがはたらく'],a:0,ex:'慣性の法則。合力が0のとき、物体は静止し続けるか等速直線運動を続ける。'},
  {id:'p_s2',f:'phys',lv:'std',q:'斜面を下る台車の速さが一定の割合で増えるのはなぜか。',ch:['重力の斜面方向の分力が一定だから','摩擦力が増えるから','空気の抵抗が減るから','速さに比例して力が増えるから'],a:0,ex:'斜面の傾きが一定なら重力の斜面方向の分力も一定で、一定の割合で速さが増す（等加速度運動）。'},
  {id:'p_s3',f:'phys',lv:'std',q:'作用・反作用の法則の説明として正しいものはどれか。',ch:['1つの物体にはたらく2力がつり合う','2つの物体が互いに同じ大きさで逆向きの力をおよぼし合う','力は必ず打ち消し合う','大きい物体ほど強い力を出す'],a:1,ex:'作用・反作用は「2つの物体の間」ではたらく。つり合いは「1つの物体にはたらく力」の話で、両者は別物。'},
  {id:'p_s4',f:'phys',lv:'std',q:'仕事の原理の説明として正しいものはどれか。',ch:['道具を使うと仕事の量が減る','道具を使っても仕事の量は変わらない','道具を使うと仕事が増える','道具では仕事はできない'],a:1,ex:'滑車や斜面を使うと力は小さくできるが、動かす距離が長くなるので仕事[J]＝力×距離は変わらない。'},
  {id:'p_s5',f:'phys',lv:'std',q:'位置エネルギーの大きさに関係するものの組み合わせはどれか。',ch:['質量と高さ','質量と速さ','高さと速さ','速さのみ'],a:0,ex:'位置エネルギーは質量と基準面からの高さに比例する。運動エネルギーは質量と速さで決まる。'},
  {id:'p_s6',f:'phys',lv:'std',q:'振り子が最下点を通過するとき、エネルギーはどうなっているか。',ch:['位置エネルギーが最大','運動エネルギーが最大','両方とも0','力学的エネルギーが減る'],a:1,ex:'最下点で高さが最小＝位置エネルギー最小、その分すべて運動エネルギーに変わり最大になる。'},
  {id:'p_s7',f:'phys',lv:'std',q:'電磁誘導によって電流が流れるのはどんなときか。',ch:['コイルの中の磁界が変化したとき','磁石を近くに置いたままのとき','電池をつないだとき','コイルを温めたとき'],a:0,ex:'磁界が変化することで誘導電流が生じる。磁石を止めたままでは電流は流れない。'},
  {id:'p_s8',f:'phys',lv:'std',q:'モーターが回る原理として正しいものはどれか。',ch:['磁界の中の電流が力を受けるから','電磁誘導が起こるから','静電気が発生するから','電流が熱に変わるから'],a:0,ex:'磁界の中を流れる電流は力を受ける（フレミング左手の法則）。この力でコイルが回転する。'},
  {id:'p_s9',f:'phys',lv:'std',q:'直流と交流のちがいとして正しいものはどれか。',ch:['交流は向きと大きさが周期的に変化する','直流のほうが電圧が高い','交流は電流が流れない','直流は電圧が変化する'],a:0,ex:'家庭のコンセントは交流。乾電池は直流。交流は変圧器で電圧を変えやすく、送電に適する。'},
  {id:'p_s10',f:'phys',lv:'std',q:'水圧について正しいものはどれか。',ch:['深いほど大きく、あらゆる向きにはたらく','深さに関係なく一定','下向きだけにはたらく','浅いほど大きい'],a:0,ex:'水圧は深さに比例して大きくなり、あらゆる向きにはたらく。この差が浮力を生む。'},
  {id:'p_s11',f:'phys',lv:'std',q:'浮力の大きさは何で決まるか。',ch:['物体の質量','物体が押しのけた液体の重さ','物体の高さ','液体の深さ'],a:1,ex:'アルキメデスの原理。浮力＝押しのけた液体の重さ。深さそのものには関係しない。'},
  {id:'p_h1',f:'phys',lv:'hard',q:'抵抗10Ωと20Ωを直列につなぎ、全体に6Vの電圧を加えた。10Ωにかかる電圧はいくらか。',ch:['1V','2V','3V','4V'],a:1,ex:'合成抵抗30Ω、電流は6÷30＝0.2A。10Ωの電圧は0.2×10＝2V。直列では抵抗の比で電圧が分かれる。'},
  {id:'p_h2',f:'phys',lv:'hard',q:'100Wの電熱器を5分間使ったときの電力量は何Jか。',ch:['500J','3000J','30000J','500000J'],a:2,ex:'電力量[J]＝電力[W]×時間[s]。100×300秒＝30000J。分を秒に直すのを忘れやすい。'},
  {id:'p_h3',f:'phys',lv:'hard',q:'質量2kgの物体を1.5m持ち上げたときの仕事は何Jか（重力は1kgあたり10Nとする）。',ch:['3J','15J','30J','300J'],a:2,ex:'重力は2×10＝20N。仕事＝20N×1.5m＝30J。'},
  {id:'p_h4',f:'phys',lv:'hard',q:'動滑車を1個使って物体を持ち上げるとき、正しいものはどれか。',ch:['力は半分、引く距離も半分','力は半分、引く距離は2倍','力は2倍、引く距離は半分','力も距離も変わらない'],a:1,ex:'動滑車1個で力は半分になるが、ひもを引く距離は2倍になる。仕事の量は変わらない。'},
  {id:'p_h5',f:'phys',lv:'hard',q:'ばねに20Nの力を加えると4cm伸びた。30Nでは何cm伸びるか。',ch:['5cm','6cm','8cm','12cm'],a:1,ex:'フックの法則より伸びは力に比例。20N:4cm＝30N:x、x＝6cm。'},
  {id:'p_h6',f:'phys',lv:'hard',q:'質量の異なる2つの物体を同じ高さから落としたとき、空気の抵抗を無視すると落下のようすはどうなるか。',ch:['重い方が速く落ちる','軽い方が速く落ちる','同じように落ちる','途中で入れかわる'],a:2,ex:'空気の抵抗がなければ質量によらず同じ加速度で落下する。日常で差が出るのは空気の抵抗のため。'},
  {id:'p_h8',f:'phys',lv:'hard',q:'電熱線の抵抗を2倍にして同じ電圧を加えると、消費電力はどうなるか。',ch:['2倍','4倍','半分','4分の1'],a:2,ex:'P＝V2/R より、電圧一定で抵抗が2倍になると電力は半分になる。'},
  {id:'c_e1',f:'chem',lv:'easy',q:'物質が状態変化するとき、変化しないものはどれか。',ch:['体積','質量','密度','見た目'],a:1,ex:'状態変化では粒子の集まり方が変わるだけで粒子の数は変わらないので、質量は変化しない。体積は変わる。'},
  {id:'c_e2',f:'chem',lv:'easy',q:'水が氷になるときの体積はどうなるか。',ch:['増える','減る','変わらない','半分になる'],a:0,ex:'水は例外的に、固体（氷）になると体積が増える。そのため氷は水に浮く。'},
  {id:'c_e3',f:'chem',lv:'easy',q:'密度の求め方として正しいものはどれか。',ch:['質量÷体積','体積÷質量','質量×体積','質量＋体積'],a:0,ex:'密度[g/cm3]＝質量[g]÷体積[cm3]。物質を見分ける手がかりになる。'},
  {id:'c_e4',f:'chem',lv:'easy',q:'二酸化炭素の性質として正しいものはどれか。',ch:['石灰水を白くにごらせる','ものを燃やすはたらきがある','空気より軽い','特有の刺激臭がある'],a:0,ex:'二酸化炭素は石灰水を白濁させる。空気より重く、水に少し溶けて酸性を示す。'},
  {id:'c_e5',f:'chem',lv:'easy',q:'酸素の性質として正しいものはどれか。',ch:['それ自身が燃える','ものを燃やすはたらきがある','水によく溶ける','石灰水を白くにごらせる'],a:1,ex:'酸素自身は燃えないが、他のものが燃えるのを助ける（助燃性）。'},
  {id:'c_e6',f:'chem',lv:'easy',q:'水にとけている固体を、水を蒸発させずに取り出す方法はどれか。',ch:['ろ過','再結晶','蒸留','燃焼'],a:1,ex:'温度による溶解度の差を利用して結晶として取り出すのが再結晶。ろ過は溶けていない固体を分ける。'},
  {id:'c_e7',f:'chem',lv:'easy',q:'蒸留で分けられるのはどんな混合物か。',ch:['沸点の違う液体の混合物','色の違う固体','大きさの違う粒','磁石につく金属'],a:0,ex:'蒸留は沸点の差を利用する。水とエタノールの分離が代表例。'},
  {id:'c_e8',f:'chem',lv:'easy',q:'原子について正しいものはどれか。',ch:['化学変化でそれ以上分けられない','種類によらず質量は同じ','化学変化で別の種類に変わる','必ず2個以上で存在する'],a:0,ex:'原子は化学変化でそれ以上分割できず、種類ごとに質量や大きさが決まっている。'},
  {id:'c_e9',f:'chem',lv:'easy',q:'水の化学式はどれか。',ch:['H2O','CO2','NaCl','O2'],a:0,ex:'水はH2O。二酸化炭素CO2、塩化ナトリウムNaCl、酸素O2。'},
  {id:'c_e10',f:'chem',lv:'easy',q:'化学変化の前後で全体の質量が変わらないという法則はどれか。',ch:['質量保存の法則','定比例の法則','オームの法則','慣性の法則'],a:0,ex:'質量保存の法則。原子の組み合わせが変わるだけで原子の種類と数は変わらないため。'},
  {id:'c_e11',f:'chem',lv:'easy',q:'鉄と硫黄を混ぜて加熱してできる物質はどれか。',ch:['鉄と硫黄の混合物','硫化鉄','酸化鉄','塩化鉄'],a:1,ex:'鉄＋硫黄→硫化鉄（FeS）。もとの鉄とは性質が異なり、磁石につかなくなる。'},
  {id:'c_e12',f:'chem',lv:'easy',q:'酸化と還元の関係として正しいものはどれか。',ch:['同時に起こる','別々に起こる','酸化だけ起こる','どちらも起こらない'],a:0,ex:'ある物質が酸素を失う（還元）とき、別の物質が酸素を受け取る（酸化）。両者は必ず同時に起こる。'},
  {id:'c_s1',f:'chem',lv:'std',q:'炭酸水素ナトリウムを加熱すると生じないものはどれか。',ch:['炭酸ナトリウム','二酸化炭素','水','酸素'],a:3,ex:'2NaHCO3→Na2CO3＋CO2＋H2O。酸素は発生しない。'},
  {id:'c_s2',f:'chem',lv:'std',q:'水の電気分解で、陰極と陽極に発生する気体の体積比はどうなるか。',ch:['水素:酸素＝1:1','水素:酸素＝2:1','水素:酸素＝1:2','水素:酸素＝3:1'],a:1,ex:'2H2O→2H2＋O2。水素が陰極に2、酸素が陽極に1の体積比で発生する。'},
  {id:'c_s3',f:'chem',lv:'std',q:'銅を加熱して酸化銅にするとき、銅と酸素が結びつく質量比はどれか。',ch:['1:1','2:1','4:1','3:2'],a:2,ex:'銅:酸素＝4:1。マグネシウムの場合は3:2。入試頻出なので数値を覚える。'},
  {id:'c_s4',f:'chem',lv:'std',q:'電解質の水溶液に電流が流れる理由はどれか。',ch:['水が電気を通すから','溶けてイオンに分かれているから','分子のまま動くから','温度が高いから'],a:1,ex:'電解質は水に溶けると陽イオンと陰イオンに電離し、これらが移動することで電流が流れる。'},
  {id:'c_s5',f:'chem',lv:'std',q:'塩酸に含まれる陽イオンはどれか。',ch:['水素イオン','塩化物イオン','ナトリウムイオン','水酸化物イオン'],a:0,ex:'HCl→H+ ＋ Cl-。酸の性質は水素イオンH+によるもの。'},
  {id:'c_s6',f:'chem',lv:'std',q:'アルカリ性の水溶液に共通して含まれるイオンはどれか。',ch:['水素イオン','水酸化物イオン','塩化物イオン','ナトリウムイオン'],a:1,ex:'アルカリは水に溶けて水酸化物イオンOH-を生じる物質。'},
  {id:'c_s7',f:'chem',lv:'std',q:'中和反応で必ずできるものはどれか。',ch:['水','気体','沈殿','金属'],a:0,ex:'H+ ＋ OH- → H2O。水は必ずできるが、塩は種類により沈殿することも溶けたままのこともある。'},
  {id:'c_s8',f:'chem',lv:'std',q:'BTB溶液が黄色を示すのはどんな水溶液か。',ch:['酸性','中性','アルカリ性','どれでもない'],a:0,ex:'BTBは酸性で黄、中性で緑、アルカリ性で青。'},
  {id:'c_s9',f:'chem',lv:'std',q:'金属のイオンへのなりやすさ（イオン化傾向）が大きいものはどれか。',ch:['銅','銀','マグネシウム','金'],a:2,ex:'マグネシウム＞亜鉛＞鉄＞銅＞銀の順。イオンになりやすい金属ほど電池の負極になりやすい。'},
  {id:'c_s10',f:'chem',lv:'std',q:'ダニエル電池で亜鉛板が果たす役割はどれか。',ch:['正極','負極','電解質','絶縁体'],a:1,ex:'イオン化傾向の大きい亜鉛が電子を放って溶け出し、負極になる。銅板が正極。'},
  {id:'c_s11',f:'chem',lv:'std',q:'質量パーセント濃度10%の食塩水200gに含まれる食塩は何gか。',ch:['10g','20g','30g','40g'],a:1,ex:'200×0.10＝20g。濃度＝溶質の質量÷水溶液全体の質量×100。'},
  {id:'c_h1',f:'chem',lv:'hard',q:'マグネシウム3.0gを完全に酸化させると酸化マグネシウムは何gできるか（Mg:O＝3:2）。',ch:['4.0g','4.5g','5.0g','6.0g'],a:2,ex:'Mg3.0gに結びつく酸素は2.0g。よって3.0＋2.0＝5.0g。'},
  {id:'c_h2',f:'chem',lv:'hard',q:'銅8.0gを加熱して完全に酸化させたときにできる酸化銅は何gか（Cu:O＝4:1）。',ch:['9.0g','10.0g','12.0g','16.0g'],a:1,ex:'銅8.0gに結びつく酸素は2.0g。8.0＋2.0＝10.0g。'},
  {id:'c_h3',f:'chem',lv:'hard',q:'うすい塩酸に石灰石を入れると気体が発生した。この気体を集めるのに適した方法はどれか。',ch:['水上置換法','上方置換法','下方置換法','どれでもよい'],a:2,ex:'発生するのは二酸化炭素で、水に少し溶け空気より重い。下方置換が適する（純粋に集めるなら水上置換も可）。'},
  {id:'c_h4',f:'chem',lv:'hard',q:'化学反応式 2H2＋O2→2H2O が示していることとして正しいものはどれか。',ch:['水素2gと酸素1gが反応する','水素分子2個と酸素分子1個から水分子2個ができる','水素原子2個が反応する','体積が半分になる'],a:1,ex:'係数は分子の個数の比を表す。質量比ではない点に注意。'},
  {id:'c_h5',f:'chem',lv:'hard',q:'塩酸に水酸化ナトリウム水溶液を加えて完全に中和したとき、水溶液を蒸発させると残る物質はどれか。',ch:['水酸化ナトリウム','塩化ナトリウム','塩酸','何も残らない'],a:1,ex:'HCl＋NaOH→NaCl＋H2O。塩化ナトリウムが塩として残る。'},
  {id:'c_h6',f:'chem',lv:'hard',q:'塩化銅水溶液を電気分解したとき、陰極で起こることはどれか。',ch:['塩素が発生する','銅が付着する','水素が発生する','酸素が発生する'],a:1,ex:'陽イオンである銅イオンCu2+が陰極で電子を受け取り、銅として付着する。陽極では塩素が発生。'},
  {id:'c_h7',f:'chem',lv:'hard',q:'溶解度が60℃で110g、20℃で32g（水100gあたり）の物質を、60℃の飽和水溶液210gから20℃に冷やすと何gの結晶が出るか。',ch:['32g','60g','78g','110g'],a:2,ex:'60℃で水100gに110g溶けて計210g。20℃では32gしか溶けないので、110－32＝78gが析出する。'},
  {id:'b_e1',f:'bio',lv:'easy',q:'植物が光合成を行うのに必要ないものはどれか。',ch:['光','二酸化炭素','水','酸素'],a:3,ex:'光合成は光・水・二酸化炭素からデンプンと酸素をつくる。酸素は原料ではなく生成物。'},
  {id:'b_e2',f:'bio',lv:'easy',q:'光合成が行われる細胞の部分はどこか。',ch:['核','葉緑体','液胞','細胞壁'],a:1,ex:'葉緑体に含まれる緑色の色素クロロフィルが光を吸収する。'},
  {id:'b_e3',f:'bio',lv:'easy',q:'葉の裏に多くあり、気体の出入り口となるものはどれか。',ch:['気孔','道管','師管','葉緑体'],a:0,ex:'2つの孔辺細胞にはさまれたすきまが気孔。蒸散もここで行われる。'},
  {id:'b_e4',f:'bio',lv:'easy',q:'根から吸い上げた水が通る管はどれか。',ch:['道管','師管','形成層','気孔'],a:0,ex:'道管は水と養分（無機物）を運ぶ。師管は葉でできた栄養分を運ぶ。'},
  {id:'b_e5',f:'bio',lv:'easy',q:'被子植物と裸子植物のちがいとして正しいものはどれか。',ch:['胚珠が子房に包まれているかどうか','花が咲くかどうか','種子をつくるかどうか','葉があるかどうか'],a:0,ex:'被子植物は胚珠が子房の中にある。裸子植物（マツなど）は胚珠がむき出し。'},
  {id:'b_e6',f:'bio',lv:'easy',q:'単子葉類の特徴として正しいものはどれか。',ch:['葉脈が網目状','根が主根と側根','子葉が1枚','維管束が輪状に並ぶ'],a:2,ex:'単子葉類は子葉1枚、平行脈、ひげ根、維管束が散在。双子葉類はその逆。'},
  {id:'b_e7',f:'bio',lv:'easy',q:'細胞のつくりで、植物細胞にあって動物細胞にないものはどれか。',ch:['核','細胞膜','細胞壁','細胞質'],a:2,ex:'細胞壁・葉緑体・発達した液胞は植物細胞の特徴。'},
  {id:'b_e8',f:'bio',lv:'easy',q:'ヒトの消化液のうち、デンプンを分解するものはどれか。',ch:['だ液','胃液','胆汁','なし'],a:0,ex:'だ液に含まれるアミラーゼがデンプンを麦芽糖に分解する。胃液のペプシンはタンパク質を分解。'},
  {id:'b_e9',f:'bio',lv:'easy',q:'小腸の内側にある、養分を吸収するつくりはどれか。',ch:['柔毛','肺胞','じん臓','ぼうこう'],a:0,ex:'柔毛によって表面積が大きくなり、効率よく養分を吸収できる。'},
  {id:'b_e10',f:'bio',lv:'easy',q:'肺で酸素と二酸化炭素の交換が行われる部分はどれか。',ch:['気管','気管支','肺胞','横隔膜'],a:2,ex:'肺胞は毛細血管に囲まれた小さな袋で、ここでガス交換が起こる。'},
  {id:'b_e11',f:'bio',lv:'easy',q:'心臓から送り出される血液が通る血管はどれか。',ch:['動脈','静脈','毛細血管','リンパ管'],a:0,ex:'心臓から出るのが動脈、心臓へもどるのが静脈。血液の種類（動脈血・静脈血）とは別の分類。'},
  {id:'b_e12',f:'bio',lv:'easy',q:'刺激に対して意識とは無関係に起こる反応を何というか。',ch:['反射','随意運動','condition','反応時間'],a:0,ex:'反射は脳を経由せず脊髄などで命令が出るため、反応がきわめて速い。'},
  {id:'b_s1',f:'bio',lv:'std',q:'だ液のはたらきを調べる実験で、対照実験として用意すべきものはどれか。',ch:['だ液のかわりに水を入れたもの','だ液を2倍にしたもの','温度を変えたもの','試験管を大きくしたもの'],a:0,ex:'調べたい条件（だ液の有無）だけを変え、他は同じにするのが対照実験の原則。'},
  {id:'b_s2',f:'bio',lv:'std',q:'ヨウ素液とベネジクト液の反応の組み合わせとして正しいものはどれか。',ch:['ヨウ素液は糖に反応する','ベネジクト液はデンプンに反応する','ヨウ素液はデンプンで青紫色になる','どちらも同じ反応をする'],a:2,ex:'ヨウ素液はデンプンで青紫色。ベネジクト液は糖と加熱で赤褐色の沈殿。'},
  {id:'b_s3',f:'bio',lv:'std',q:'細胞分裂のときに見られる、ひも状のつくりはどれか。',ch:['染色体','葉緑体','液胞','細胞壁'],a:0,ex:'核の中の染色体が複製されて2つに分かれ、同じ遺伝情報をもつ2個の細胞ができる。'},
  {id:'b_s4',f:'bio',lv:'std',q:'減数分裂によってできる生殖細胞の染色体の数は、体細胞と比べてどうなるか。',ch:['同じ','半分','2倍','4分の1'],a:1,ex:'半分になる。受精によってもとの数にもどるため、世代を重ねても数が保たれる。'},
  {id:'b_s5',f:'bio',lv:'std',q:'無性生殖でできた子の遺伝子について正しいものはどれか。',ch:['親と同じ','親の半分','両親の混合','ランダムに決まる'],a:0,ex:'無性生殖では体細胞分裂で増えるため、子は親と同じ遺伝子をもつ（クローン）。'},
  {id:'b_s6',f:'bio',lv:'std',q:'丸い種子（AA）としわの種子（aa）をかけ合わせたとき、子（F1）の形質はどうなるか。',ch:['すべて丸','すべてしわ','丸:しわ＝1:1','丸:しわ＝3:1'],a:0,ex:'子はすべてAaとなり、顕性形質である丸が現れる。'},
  {id:'b_s7',f:'bio',lv:'std',q:'子（Aa）どうしをかけ合わせたときの孫の形質の比はどうなるか。',ch:['1:1','2:1','3:1','9:3:3:1'],a:2,ex:'AA:Aa:aa＝1:2:1となり、表現型は顕性:潜性＝3:1。'},
  {id:'b_s8',f:'bio',lv:'std',q:'食物連鎖において、生産者にあたるものはどれか。',ch:['植物','草食動物','肉食動物','菌類'],a:0,ex:'光合成で有機物をつくる植物が生産者。動物は消費者、菌類・細菌類は分解者。'},
  {id:'b_s9',f:'bio',lv:'std',q:'生態系で数量のつり合いが保たれているとき、生物の数の関係として正しいものはどれか。',ch:['草食動物が最も多い','肉食動物が最も多い','植物が最も多い','すべて同じ'],a:2,ex:'生産者である植物が最も多く、上位の消費者ほど少なくなるピラミッド型になる。'},

  {id:'b_s11',f:'bio',lv:'std',q:'だ液せんや肝臓のように、はたらきの異なる細胞が集まって特定の役割を果たすものを何というか。',ch:['細胞','組織','器官','個体'],a:2,ex:'細胞→組織→器官→個体の順に構成されていく。'},
  {id:'b_h1',f:'bio',lv:'hard',q:'蒸散量を調べる実験で、葉の裏にワセリンを塗った枝の水の減少が最も少なかった。この結果から言えることはどれか。',ch:['蒸散は葉の表で多い','蒸散は葉の裏で多い','蒸散は茎で起こる','蒸散は起こらない'],a:1,ex:'裏をふさぐと減少量が最も小さい＝ふさいだ部分の蒸散が多かったことになる。気孔は葉の裏に多い。'},
  {id:'b_h2',f:'bio',lv:'hard',q:'光合成と呼吸について、昼間の植物で正しいものはどれか。',ch:['光合成だけ行う','呼吸だけ行う','両方行い、光合成の量が多い','両方行い、呼吸の量が多い'],a:2,ex:'植物は一日中呼吸している。昼は光合成量が呼吸量を上回るため、見かけ上は二酸化炭素を吸収する。'},
  {id:'b_h3',f:'bio',lv:'hard',q:'エンドウの丸い種子（Aa）と、しわの種子（aa）をかけ合わせたときの子の比はどれか。',ch:['すべて丸','丸:しわ＝1:1','丸:しわ＝3:1','すべてしわ'],a:1,ex:'Aa×aa→Aa:aa＝1:1。検定交雑と呼ばれ、遺伝子型を調べるのに使う。'},
  {id:'b_h4',f:'bio',lv:'hard',q:'血液の成分のうち、二酸化炭素を主に運ぶものはどれか。',ch:['赤血球','白血球','血小板','血しょう'],a:3,ex:'酸素はヘモグロビン（赤血球）が運ぶが、二酸化炭素は主に血しょうに溶けて運ばれる。'},
  {id:'b_h5',f:'bio',lv:'hard',q:'じん臓のはたらきとして正しいものはどれか。',ch:['尿素をつくる','血液中の不要物をこしとる','養分を吸収する','胆汁をつくる'],a:1,ex:'尿素をつくるのは肝臓。じん臓はそれを血液からこしとって尿にする。'},
  {id:'b_h6',f:'bio',lv:'hard',q:'セキツイ動物のうち、体温が外界の温度によって変わるのはどれか。',ch:['ホニュウ類','鳥類','ハチュウ類','どれも変わらない'],a:2,ex:'ハチュウ類・両生類・魚類は変温動物。ホニュウ類と鳥類は恒温動物。'},
  {id:'b_h7',f:'bio',lv:'hard',q:'化石として見つかったシソチョウが、進化の証拠とされる理由はどれか。',ch:['ハチュウ類と鳥類の両方の特徴をもつから','最も古い化石だから','現在も生きているから','大型だったから'],a:0,ex:'翼や羽毛（鳥類の特徴）と歯や爪（ハチュウ類の特徴）を併せもつ。'},
  {id:'e_e1',f:'earth',lv:'easy',q:'火成岩のうち、マグマが地表付近で急に冷えてできた岩石はどれか。',ch:['深成岩','火山岩','堆積岩','変成岩'],a:1,ex:'火山岩は急冷のため斑状組織になる。深成岩はゆっくり冷えて等粒状組織。'},
  {id:'e_e2',f:'earth',lv:'easy',q:'ねばりけの強いマグマがつくる火山の形はどれか。',ch:['傾斜のゆるい形','ドーム状の盛り上がった形','平らな形','くぼんだ形'],a:1,ex:'ねばりけが強いと流れにくくドーム状に盛り上がり、噴火は激しくなる。溶岩の色も白っぽい。'},
  {id:'e_e3',f:'earth',lv:'easy',q:'地震のゆれのうち、はじめに来る小さなゆれを何というか。',ch:['主要動','初期微動','余震','前震'],a:1,ex:'速いP波による初期微動のあと、遅いS波による主要動が来る。'},

  {id:'e_e5',f:'earth',lv:'easy',q:'れき・砂・泥のうち、河口から最も遠くまで運ばれて堆積するものはどれか。',ch:['れき','砂','泥','同時に堆積する'],a:2,ex:'粒が小さいほど遠くまで運ばれる。海岸近くにれき、沖に泥が堆積する。'},

  {id:'e_e9',f:'earth',lv:'easy',q:'日本の冬に発達し、北西の季節風をもたらす気団はどれか。',ch:['シベリア気団','小笠原気団','オホーツク海気団','赤道気団'],a:0,ex:'冬はシベリア気団（寒冷・乾燥）が発達し、西高東低の気圧配置になる。'},

  {id:'e_e12',f:'earth',lv:'easy',q:'日本で季節が生じる主な原因はどれか。',ch:['地軸が傾いたまま公転しているから','太陽との距離が変わるから','自転の速さが変わるから','大気の量が変わるから'],a:0,ex:'地軸が約23.4度傾いたまま公転するため、季節で太陽高度と昼の長さが変わる。'},
  {id:'e_s1',f:'earth',lv:'std',q:'P波の速さが6km/s、S波が4km/sのとき、震源から120km地点の初期微動継続時間は何秒か。',ch:['5秒','10秒','15秒','20秒'],a:1,ex:'P波は20秒、S波は30秒で到達。差の10秒が初期微動継続時間。距離に比例して長くなる。'},

  {id:'e_s4',f:'earth',lv:'std',q:'飽和水蒸気量が17g/m3のとき、空気中に8.5g/m3の水蒸気がある。湿度は何%か。',ch:['25%','50%','75%','85%'],a:1,ex:'湿度＝実際の水蒸気量÷飽和水蒸気量×100＝8.5÷17×100＝50%。'},
  {id:'e_s5',f:'earth',lv:'std',q:'寒冷前線が通過した後の天気の変化として正しいものはどれか。',ch:['気温が上がり南寄りの風','気温が下がり北寄りの風','変化しない','雨が長く続く'],a:1,ex:'寒冷前線通過後は寒気に入るため気温が下がり、風向が北寄りに変わる。短時間の強い雨が特徴。'},

  {id:'e_s9',f:'earth',lv:'std',q:'月食が起こるときの並び方として正しいものはどれか。',ch:['太陽－月－地球','太陽－地球－月','月－太陽－地球','地球－太陽－月'],a:1,ex:'月が地球の影に入るのが月食。太陽－月－地球の並びは日食。'},

  {id:'e_s11',f:'earth',lv:'std',q:'日本で夏至の日の南中高度が最も高くなる理由はどれか.',ch:['地軸の北極側が太陽の方向に傾くから','地球が太陽に最も近づくから','自転が速くなるから','大気が薄くなるから'],a:0,ex:'夏至には北半球が太陽側に傾くため、南中高度が高く昼が長くなる。'},
  {id:'e_h1',f:'earth',lv:'hard',q:'地震のゆれが震源から等速で伝わるとして、震源距離80kmでP波が10秒後、160kmで20秒後に到達した。P波の速さは何km/sか。',ch:['4km/s','6km/s','8km/s','16km/s'],a:2,ex:'80km÷10秒＝8km/s。160km÷20秒でも8km/sで一致する。'},

  {id:'e_h5',f:'earth',lv:'hard',q:'北緯35度の地点における夏至の南中高度はおよそ何度か。',ch:['約31.6度','約55度','約78.4度','約90度'],a:2,ex:'南中高度＝90－緯度＋23.4＝90－35＋23.4＝78.4度。'},
  {id:'e_h6',f:'earth',lv:'hard',q:'太陽の黒点が移動して見えることからわかることはどれか。',ch:['太陽が自転していること','太陽が公転していること','地球が自転していること','黒点が動く天体であること'],a:0,ex:'黒点の位置が日ごとに移動し、周辺部で形がゆがむことから、太陽が自転する球体だとわかる。'},

  {id:'p_e15',f:'phys',lv:'easy',q:'光の直進によって起こる現象はどれか。',ch:['影ができる','虹ができる','鏡に映る','水中で曲がって見える'],a:0,ex:'影は光が直進し、物体にさえぎられてできる。虹は屈折と分散、鏡は反射による。'},

  {id:'p_e18',f:'phys',lv:'easy',q:'力の3要素に含まれないものはどれか。',ch:['力の大きさ','力の向き','作用点','力の速さ'],a:3,ex:'力は大きさ・向き・作用点の3つで表され、矢印で図示する。'},
  {id:'p_e19',f:'phys',lv:'easy',q:'摩擦力の向きとして正しいものはどれか。',ch:['動く向きと同じ','動く向きと逆','上向き','下向き'],a:1,ex:'摩擦力は物体の運動をさまたげる向き、つまり動こうとする向きと逆にはたらく。'},
  {id:'p_e20',f:'phys',lv:'easy',q:'電流の単位と、電圧の単位の組み合わせとして正しいものはどれか。',ch:['A と V','V と A','W と J','Ω と A'],a:0,ex:'電流はアンペア[A]、電圧はボルト[V]、抵抗はオーム[Ω]。'},
  {id:'p_s12',f:'phys',lv:'std',q:'抵抗の大きい電熱線と小さい電熱線を直列につないだとき、発熱量が大きいのはどちらか。',ch:['抵抗の大きい方','抵抗の小さい方','同じ','電圧による'],a:0,ex:'直列では電流が同じなので、発熱量Q＝I2Rより抵抗が大きいほど発熱量も大きい。'},

  {id:'p_s14',f:'phys',lv:'std',q:'静電気で、同じ種類の電気を帯びた物体どうしはどうなるか。',ch:['引き合う','しりぞけ合う','変化しない','くっついて離れない'],a:1,ex:'同種の電気は反発、異種の電気は引き合う。'},
  {id:'p_s15',f:'phys',lv:'std',q:'真空放電で、-極から+極へ流れる粒子の流れを何というか。',ch:['陽子線','陰極線（電子の流れ）','X線','放射線'],a:1,ex:'陰極線の正体は電子の流れ。電流の向きは電子の流れと逆と定められている。'},

  {id:'p_s17',f:'phys',lv:'std',q:'エネルギーの移り変わりで、力学的エネルギーが保存されないのはどんなときか。',ch:['摩擦や空気の抵抗があるとき','高さが変わるとき','速さが変わるとき','質量が大きいとき'],a:0,ex:'摩擦などがあると力学的エネルギーの一部が熱エネルギーに変わり、保存されない。'},
  {id:'p_h9',f:'phys',lv:'hard',q:'壁に向かって声を出したところ、2秒後にやまびこが聞こえた。音速を340m/sとすると壁までの距離は何mか。',ch:['170m','340m','680m','1360m'],a:1,ex:'音は往復で680m進む。片道はその半分の340m。'},

  {id:'p_h12',f:'phys',lv:'hard',q:'質量5kgの物体を、動滑車1個を使って2m持ち上げた。ひもを引く力と引く長さの組み合わせはどれか（1kgあたり10N）。',ch:['50N・2m','25N・4m','25N・2m','100N・1m'],a:1,ex:'重力50N。動滑車で力は半分の25N、引く長さは2倍の4m。仕事は100Jで変わらない。'},

  {id:'c_s12',f:'chem',lv:'std',q:'酸化銀を加熱したときに起こる変化はどれか。',ch:['分解して銀と酸素になる','酸化されて質量が増える','何も起こらない','水ができる'],a:0,ex:'2Ag2O→4Ag＋O2。加熱による分解（熱分解）で、白色の銀が残る。'},

  {id:'c_t9',f:'chem',lv:'std',q:'スチールウールは燃えると質量が増えるのに、木が燃えると灰は軽くなる。この違いの理由はどれか。',ch:['木では気体が発生して空気中へ出ていくから','木は燃えないから','鉄は軽いから','灰が水を含むから'],a:0,ex:'木は有機物で、燃えると二酸化炭素と水蒸気が空気中へ出る。鉄は酸素と結びつくだけなので増える。'},
  {id:'c_t10',f:'chem',lv:'std',q:'酸化銅と炭素を混ぜて加熱したあと、石灰水が白くにごった。このことからわかることはどれか。',ch:['二酸化炭素が発生したこと','酸素が発生したこと','水ができたこと','銅が溶けたこと'],a:0,ex:'炭素が酸化銅から酸素をうばって二酸化炭素になった。同時に酸化銅は還元されて銅になる。'},
  {id:'c_t11',f:'chem',lv:'std',q:'うすい塩酸に水酸化ナトリウム水溶液を少しずつ加えていくと、水溶液中の水素イオンの数はどうなるか。',ch:['減っていく','増えていく','変わらない','2倍になる'],a:0,ex:'加えた水酸化物イオンと結びついて水になるため、水素イオンは減っていく。中性で0になる。'},
  {id:'c_t12',f:'chem',lv:'std',q:'中和が進む間、水溶液中のナトリウムイオンの数はどうなるか。',ch:['増えていく','減っていく','変わらない','0になる'],a:0,ex:'ナトリウムイオンは反応に関わらず（そのまま残る）、加えた分だけ増え続ける。塩化物イオンは変わらない。'},
  {id:'c_t13',f:'chem',lv:'std',q:'電気分解で塩酸を分解したとき、陰極側に発生する気体の性質を確かめる方法はどれか。',ch:['マッチの火を近づけて音を確認する','石灰水に通す','においをかぐ','リトマス紙をつける'],a:0,ex:'陰極には水素が発生する。火を近づけるとポンと音を立てて燃える。陽極の塩素は刺激臭と漂白作用で確認。'},
  {id:'c_t14',f:'chem',lv:'hard',q:'マグネシウム0.6gを加熱したところ、加熱後の質量が0.9gで一定になった。結びついた酸素は何gか。',ch:['0.2g','0.3g','0.6g','0.9g'],a:1,ex:'0.9－0.6＝0.3g。Mg:O＝3:2の比とも一致する。'},
  {id:'c_t15',f:'chem',lv:'hard',q:'銅の粉末を加熱していくと、あるところから質量が増えなくなった。この理由はどれか。',ch:['すべての銅が酸素と結びついたから','酸素がなくなったから','銅が蒸発したから','温度が下がったから'],a:0,ex:'反応が完了すると、それ以上酸素と結びつかないので質量が一定になる。この点から反応する質量比を求められる。'},
  {id:'c_t16',f:'chem',lv:'hard',q:'40℃の飽和食塩水を20℃に冷やしてもほとんど結晶が出ないのはなぜか。',ch:['食塩の溶解度が温度でほとんど変わらないから','食塩が溶けないから','水が蒸発するから','温度が下がらないから'],a:0,ex:'食塩は温度による溶解度の変化が小さい。再結晶で取り出すには水を蒸発させる必要がある。'},
  {id:'b_t1',f:'bio',lv:'easy',q:'日光に当てた葉の一部をアルミはくでおおって実験するのはなぜか。',ch:['光の有無だけを変えて比べるため','葉を守るため','温度を上げるため','水を防ぐため'],a:0,ex:'調べたい条件だけを変える対照実験。同じ葉で比べるので他の条件がそろう。'},
  {id:'b_t2',f:'bio',lv:'easy',q:'ヨウ素液で調べる前に、葉をあたためたエタノールに入れる理由はどれか。',ch:['葉の緑色を抜いて色の変化を見やすくするため','デンプンを増やすため','葉をやわらかくするため','消毒するため'],a:0,ex:'クロロフィルを溶かし出して脱色する。エタノールは引火しやすいので湯せんで温める。'},
  {id:'b_t3',f:'bio',lv:'easy',q:'水草を入れた試験管に息を吹き込んでから光を当てると気泡が出た。この気体は何か。',ch:['酸素','二酸化炭素','水素','窒素'],a:0,ex:'息に含まれる二酸化炭素を材料に光合成が行われ、酸素が発生する。'},
  {id:'b_t4',f:'bio',lv:'easy',q:'根の先端近くに細い毛のような根毛があることの利点はどれか。',ch:['表面積が大きくなり水を吸収しやすい','体を支えやすい','光を集めやすい','風に強い'],a:0,ex:'表面積を大きくして吸収効率を上げる工夫。小腸の柔毛、肺の肺胞と同じ考え方。'},
  {id:'b_t5',f:'bio',lv:'easy',q:'葉が互いに重ならないようについているのはなぜか。',ch:['どの葉にも光が当たるようにするため','風通しをよくするため','水をためるため','虫を防ぐため'],a:0,ex:'葉のつき方（葉序）は、光合成の効率を上げるように配置されている。'},
  {id:'b_t6',f:'bio',lv:'easy',q:'肺胞がたくさんの小さな袋に分かれていることの利点はどれか。',ch:['気体を交換する表面積が大きくなる','空気をためられる','音が出る','体温が上がる'],a:0,ex:'表面積を大きくして効率を上げるという、生物に共通する仕組み。'},
  {id:'b_t7',f:'bio',lv:'std',q:'だ液のはたらきを調べる実験を、40℃の湯に入れて行うのはなぜか。',ch:['体温に近い温度で消化酵素がよくはたらくから','早く冷ますため','水を蒸発させるため','だ液を薄めるため'],a:0,ex:'酵素には最もよくはたらく温度があり、ヒトの消化酵素は体温付近。高温では変性して失活する。'},
  {id:'b_t8',f:'bio',lv:'std',q:'デンプンにだ液を加えた液が、ヨウ素液で青紫色にならずベネジクト液で赤褐色になった。この結果が示すことはどれか。',ch:['デンプンが分解されて糖ができた','デンプンが残っている','タンパク質ができた','変化しなかった'],a:0,ex:'ヨウ素液が反応しない＝デンプンがない。ベネジクト液が反応する＝糖がある。両方を組み合わせて判断する。'},
  {id:'b_t9',f:'bio',lv:'std',q:'息を吸うとき横隔膜はどう動くか。',ch:['下がって胸の空間が広がる','上がって狭くなる','動かない','左右に動く'],a:0,ex:'横隔膜が下がりろっ骨が上がることで胸の空間が広がり、気圧が下がって空気が入ってくる。'},
  {id:'b_t10',f:'bio',lv:'std',q:'タマネギの根で細胞分裂を観察するとき、先端に近い部分を使うのはなぜか。',ch:['成長点があり分裂している細胞が多いから','細胞が大きいから','色がつきやすいから','やわらかいから'],a:0,ex:'根の先端近くの成長点で細胞分裂がさかんに行われている。根元では分裂が終わっている。'},
  {id:'b_t11',f:'bio',lv:'std',q:'無性生殖でふえた作物は、病気が広がると全滅しやすい。この理由はどれか.',ch:['すべて同じ遺伝子をもち同じ弱点をもつから','数が少ないから','成長が遅いから','根が弱いから'],a:0,ex:'遺伝的多様性がないため、1つの病気に弱いと全個体が同じように弱い。有性生殖の利点と表裏一体。'},
  {id:'b_t12',f:'bio',lv:'std',q:'ある池で肉食魚が減ったとき、直後に起こると考えられることはどれか。',ch:['えさとなる小魚が増える','小魚も減る','植物が減る','変化しない'],a:0,ex:'捕食者が減るとその獲物が一時的に増える。ただし増えすぎるとえさ不足で再び減り、全体としてつり合いが保たれる。'},
  {id:'b_t13',f:'bio',lv:'hard',q:'丸い種子をつくる個体が純系（AA）か雑種（Aa）かを調べるには、何とかけ合わせればよいか。',ch:['しわの種子（aa）','丸い種子（AA）','自分自身','調べられない'],a:0,ex:'aaとかけ合わせる（検定交雑）。AAならすべて丸、Aaなら丸:しわ＝1:1になるので区別できる。'},
  {id:'b_t14',f:'bio',lv:'hard',q:'植物を暗い箱に入れて数日おくと、葉のデンプンがなくなる。この理由はどれか。',ch:['光合成ができず、呼吸や成長で使われたから','デンプンが水に溶けたから','葉が枯れたから','デンプンが気体になったから'],a:0,ex:'光合成の実験では、あらかじめ暗所に置いてデンプンを消費させておく（これを行わないと結果が判断できない）。'},
  {id:'b_t15',f:'bio',lv:'hard',q:'ヒトの血液が肺と全身を回るとき、酸素を最も多く含んでいる血管はどれか。',ch:['肺静脈','肺動脈','大静脈','右心房'],a:0,ex:'肺でガス交換を終えた血液が流れる肺静脈が最も酸素が多い。名前は「静脈」でも動脈血が流れる点が要注意。'},
  {id:'e_t1',f:'earth',lv:'easy',q:'ねばりけの強いマグマの火山で噴火が激しくなりやすいのはなぜか。',ch:['ガスが抜けにくく内部に圧力がたまるから','温度が高いから','水が多いから','山が高いから'],a:0,ex:'ねばりけが強いと火山ガスが抜けにくく、圧力が高まって爆発的な噴火になりやすい。'},
  {id:'e_t2',f:'earth',lv:'easy',q:'同じ地層が離れた2地点で見つかった。このことからわかることはどれか。',ch:['広い範囲に同時期に堆積したこと','2地点が同じ標高であること','地層が動いたこと','火山があったこと'],a:0,ex:'凝灰岩などのかぎ層は、離れた地点の地層を対比するのに使われる。'},
  {id:'e_t3',f:'earth',lv:'easy',q:'川原の石が丸いのはなぜか。',ch:['運ばれる間に角がけずられたから','もともと丸いから','水にとけたから','熱で丸くなったから'],a:0,ex:'流水に運ばれる過程でぶつかり合い、角が取れて丸くなる。上流ほど角ばって大きい。'},
  {id:'e_t4',f:'earth',lv:'easy',q:'地層に上下の逆転がないとき、下の層と上の層ではどちらが古いか。',ch:['下の層','上の層','同じ','わからない'],a:0,ex:'下から順に積もるので下が古い。ただし地殻変動で逆転することもあり、化石や級化構造で判断する。'},
  {id:'e_t5',f:'earth',lv:'easy',q:'標高の高いところで水の沸点が100℃より低くなるのはなぜか。',ch:['大気圧が小さいから','気温が低いから','水が少ないから','空気が乾いているから'],a:0,ex:'沸騰は水蒸気の圧力が大気圧と等しくなったときに起こる。大気圧が小さいと低い温度で沸騰する。'},
  {id:'e_t6',f:'earth',lv:'std',q:'夏の朝、地面近くに霧が発生することがある。この理由はどれか。',ch:['放射冷却で気温が露点以下になったから','気温が上がったから','風が強いから','気圧が上がったから'],a:0,ex:'晴れた夜は地面から熱が逃げて（放射冷却）気温が下がり、空気中の水蒸気が水滴になる。'},
  {id:'e_t7',f:'earth',lv:'std',q:'山を越えた風が反対側でかわいた高温の風になる現象の理由はどれか。',ch:['上昇時に雨を降らせ、下降時に温度が上がるから','海の影響','気圧が同じだから','風が弱いから'],a:0,ex:'フェーン現象。上昇して雨を降らせた空気が、下降するとき圧縮されて温度が上がる。'},
  {id:'e_t8',f:'earth',lv:'std',q:'冬の日本海側と太平洋側で天気が違う理由として正しいものはどれか。',ch:['季節風が日本海で水蒸気を含み、山で雪を降らせて乾いて越えるから','海流が違うから','緯度が違うから','気温が違うから'],a:0,ex:'日本海側は雪、山を越えた太平洋側は乾燥した晴れになる。'},
  {id:'e_t9',f:'earth',lv:'std',q:'同じ時刻に観測した星が季節によって違うのはなぜか。',ch:['地球が公転して夜になる向きが変わるから','星が動くから','地球が自転するから','大気が変わるから'],a:0,ex:'公転により、夜側から見える方向の星座が季節ごとに変わる。'},
  {id:'e_t10',f:'earth',lv:'std',q:'月が地球のまわりを回っているのに、いつも同じ面しか見えないのはなぜか。',ch:['月の自転周期と公転周期が同じだから','月が自転していないから','地球が動くから','月が止まっているから'],a:0,ex:'自転と公転が同じ約27.3日なので、地球からは常に同じ面が見える。'},
  {id:'e_t11',f:'earth',lv:'hard',q:'ある地震で、震源から30km地点でP波が5秒後に到達した。震源から90km地点では何秒後か。',ch:['5秒','10秒','15秒','20秒'],a:2,ex:'P波の速さは30÷5＝6km/s。90÷6＝15秒。'},
  {id:'e_t12',f:'earth',lv:'hard',q:'季節によって南中高度が変わるのに、赤道付近で気温の変化が小さいのはなぜか。',ch:['1年を通して太陽高度が高いから','海が近いから','自転が速いから','大気が厚いから'],a:0,ex:'赤道付近は年間を通して太陽が高く、受け取るエネルギー量の変化が小さい。'},
  {id:'e_t13',f:'earth',lv:'hard',q:'露点が同じ2つの空気があるとき、含まれる水蒸気量の関係はどうなるか。',ch:['等しい','気温が高いほうが多い','気温が低いほうが多い','わからない'],a:0,ex:'露点は含まれる水蒸気量だけで決まる。気温が違っても露点が同じなら水蒸気量は同じで、湿度は異なる。'},
  {id:'p_s18',f:'phys',lv:'std',q:'力学的エネルギーの保存が成り立つとき、位置エネルギーと運動エネルギーの和はどうなるか。',ch:['一定に保たれる','増える','減る','変動する'],a:0,ex:'摩擦や空気の抵抗がなければ、両者は互いに移り変わるだけで和は変わらない。'},
  {id:'p_s19',f:'phys',lv:'std',q:'記録タイマーで台車の運動を調べたとき、テープの打点間隔が広がっていくことが示すのはどれか。',ch:['速さが増している','速さが一定','速さが減っている','止まっている'],a:0,ex:'一定時間ごとに打点するので、間隔が広い＝その間に進んだ距離が長い＝速い。'},
  {id:'p_s20',f:'phys',lv:'std',q:'等速直線運動をしている物体の、時間と移動距離の関係を表すグラフはどれか。',ch:['原点を通る直線','水平な直線','曲線','原点を通らない直線'],a:0,ex:'距離＝速さ×時間なので比例のグラフになる。時間と速さのグラフなら水平な直線。'},
  {id:'p_s21',f:'phys',lv:'std',q:'慣性の法則の例として正しいものはどれか。',ch:['急ブレーキで体が前に倒れる','物が落ちる','磁石が引き合う','ばねが伸びる'],a:0,ex:'体は運動を続けようとするため前に倒れる。発進時に後ろへ倒れるのも同じ原理。'},
  {id:'p_s22',f:'phys',lv:'std',q:'てこがつり合うときの条件として正しいものはどれか.',ch:['力の大きさ×支点からの距離が左右で等しい','力の大きさが左右で等しい','距離が左右で等しい','重さが等しい'],a:0,ex:'モーメントのつり合い。距離が2倍なら力は半分でつり合う。'},
  {id:'p_s23',f:'phys',lv:'std',q:'電力量の単位として使われないものはどれか。',ch:['J（ジュール）','Wh（ワット時）','kWh','W（ワット）'],a:3,ex:'Wは電力（1秒あたりのエネルギー）の単位。電力量は電力×時間。'},
  {id:'p_s24',f:'phys',lv:'std',q:'豆電球が直列につながれた回路で、1つが切れると他はどうなるか。',ch:['すべて消える','点いたまま','明るくなる','点滅する'],a:0,ex:'直列は電流の道が1本なので、どこかが切れると回路全体に電流が流れない。'},
  {id:'p_s25',f:'phys',lv:'std',q:'電磁誘導で流れる電流を大きくする方法として正しくないものはどれか。',ch:['磁石をゆっくり動かす','磁石を速く動かす','コイルの巻き数を増やす','強い磁石を使う'],a:0,ex:'磁界の変化が速いほど誘導電流は大きい。ゆっくりでは小さくなる。'},
  {id:'p_s26',f:'phys',lv:'std',q:'放射線について正しいものはどれか。',ch:['物質を通り抜ける性質があり、種類によって透過力が違う','目に見える','必ず人工的につくられる','熱を持つ'],a:0,ex:'α線は紙で、β線はアルミ板で、γ線とX線は鉛や厚いコンクリートで止まる。自然界にも存在する。'},
  {id:'p_s27',f:'phys',lv:'std',q:'音の速さが光の速さより遅いことを日常で確かめられる例はどれか。',ch:['雷の光と音のずれ','影ができること','虹が見えること','鏡に映ること'],a:0,ex:'光はほぼ瞬時に届き、音は1秒に約340m進む。ずれから距離を計算できる。'},
  {id:'p_h13',f:'phys',lv:'hard',q:'抵抗6Ωと3Ωを並列につなぎ、全体に6Vを加えた。回路全体に流れる電流はいくらか。',ch:['1A','2A','3A','9A'],a:2,ex:'6Ωに1A、3Ωに2A流れるので合計3A。合成抵抗2Ωから6÷2＝3Aとしても同じ。'},
  {id:'p_h14',f:'phys',lv:'hard',q:'電熱線に6Vを加えて2Aの電流が5分間流れたときの発熱量は何Jか。',ch:['60J','600J','3600J','36000J'],a:2,ex:'電力＝6×2＝12W。12×300秒＝3600J。'},
  {id:'p_h15',f:'phys',lv:'hard',q:'質量3kgの物体を高さ2mまで持ち上げ、静かに落とした。地面に達する直前の運動エネルギーは何Jか（1kgあたり10N）。',ch:['6J','30J','60J','600J'],a:2,ex:'位置エネルギー＝30N×2m＝60J。これがすべて運動エネルギーに変わる。'},
  {id:'p_h16',f:'phys',lv:'hard',q:'斜面を使って物体を持ち上げるとき、斜面の角度を小さくするとどうなるか。',ch:['力は小さくなるが距離が長くなる','力も距離も小さくなる','力が大きくなる','仕事が減る'],a:0,ex:'仕事の原理。仕事の量は変わらない。'},
  {id:'p_h17',f:'phys',lv:'hard',q:'60Wの電球と20Wの電球を並列につないだとき、明るいのはどちらか。',ch:['60Wの電球','20Wの電球','同じ','電圧による'],a:0,ex:'並列では電圧が等しいので、消費電力の大きい60Wのほうが明るい。直列だと結果が逆になる。'},
  {id:'p_h18',f:'phys',lv:'hard',q:'振り子の周期を長くする方法として正しいものはどれか。',ch:['ひもを長くする','おもりを重くする','振れ幅を大きくする','おもりを軽くする'],a:0,ex:'周期はひもの長さで決まり、おもりの質量や振れ幅（小さい範囲）にはほとんど影響されない。'},
  {id:'p_h19',f:'phys',lv:'hard',q:'水面に浮かぶ物体にはたらく浮力と重力の関係はどれか。',ch:['浮力と重力がつり合っている','浮力が大きい','重力が大きい','どちらも0'],a:0,ex:'静止して浮いているので合力は0。押しのけた水の重さが物体の重さに等しい。'},
  {id:'c_s19',f:'chem',lv:'std',q:'水溶液に電流を流したとき、陽イオンが移動する向きはどれか。',ch:['陰極へ','陽極へ','移動しない','両方へ'],a:0,ex:'陽イオンは陰極、陰イオンは陽極へ引かれる。名前と逆になる点が要注意。'},

function load(){
  try{const raw=localStorage.getItem(STORE_KEY);if(raw)return JSON.parse(raw);
    const init={stats:{},best:{}};localStorage.setItem(STORE_KEY,JSON.stringify(init));return init;
  }catch(e){if(!mem)mem={stats:{},best:{}};return mem;}
}
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state));}catch(e){mem=state;}}
let state=load();
if(!state.stats)state.stats={};
if(!state.best)state.best={};
if(state.xp==null)state.xp=0;
if(state.maxCombo==null)state.maxCombo=0;
if(!state.ach)state.ach=[];
if(!state.streak)state.streak={day:'',count:0};
if(state.taBest==null)state.taBest=0;
if(!state.stat)state.stat={day:'',dayQ:0,fields:[],peakWeak:0};
if(!state.cstat)state.cstat={};
if(state.calcDone==null)state.calcDone=0;
if(state.dailyDone==null)state.dailyDone=0;
function bumpQ(){
  const t=todayStr();
  if(state.stat.day!==t){state.stat.day=t;state.stat.dayQ=0;}
  state.stat.dayQ++;
  const h=new Date().getHours();
  if(h<5)unlock('nightowl'); else if(h<8)unlock('earlybird');
  if(state.stat.dayQ>=50)unlock('marathon');
  save();
}
if(!state.cards)state.cards=[];
if(!state.cardCount){
  state.cardCount={};
  (state.cards||[]).forEach(id=>{state.cardCount[id]=(state.cardCount[id]||0)+1;});
}

function grantCard(){
  const cnt=state.cardCount||(state.cardCount={});
  const owned=id=>(cnt[id]||0)>0;
  // 未所持は重み3倍。重複も出るが新規が出やすい
  const W={N:6,R:3,SR:1,H:0};
  const build=arr=>{
    let tot=0; const w=arr.map(c=>{const v=(W[c.r]||1)*(owned(c.id)?1:3); tot+=v; return v;});
    return {arr,w,tot};
  };
  const draw=pool=>{
    const {arr,w,tot}=build(pool);
    let x=Math.random()*tot;
    for(let i=0;i<arr.length;i++){x-=w[i];if(x<=0)return arr[i];}
    return arr[arr.length-1];
  };
  const give=(c,isHidden)=>{
    cnt[c.id]=(cnt[c.id]||0)+1;
    if(!state.cards.includes(c.id))state.cards.push(c.id);
    save();
    const dup=cnt[c.id]>1;
    const msg=isHidden
      ? '🔮 隠し図鑑を発見！ '+c.e+' '+c.n+(dup?'（重複 ×'+cnt[c.id]+'）':'')
      : '📖 図鑑に追加: '+c.e+' '+c.n+(dup?'（重複 ×'+cnt[c.id]+'）':(c.r==='SR'?'（超レア！）':c.r==='R'?'（レア）':''));
    setTimeout(()=>{toast(msg);pop(dup?6:20);},1400);
  };
  const hid=CARDS.filter(c=>c.r==='H');
  const newHid=hid.filter(c=>!owned(c.id));
  if(hid.length&&Math.random()<0.04){
    give(newHid.length?newHid[Math.floor(Math.random()*newHid.length)]
                      :hid[Math.floor(Math.random()*hid.length)],true);
    return;
  }
  const pool=CARDS.filter(c=>c.r!=='H');
  if(!pool.length)return;
  give(draw(pool),false);
}
function cardsNormal(){return CARDS.filter(c=>c.r!=='H');}

function achAll(){return ACH.concat(ACH_SECRET);}
function isSecret(id){return ACH_SECRET.some(a=>a.id===id);}
const MAXLV=20;
function xpNeed(l){return 40*l+2*l*l;}
function lvlInfo(xp){
  let l=1,acc=0,need=xpNeed(1);
  while(l<MAXLV&&xp>=acc+need){acc+=need;l++;need=xpNeed(l);}
  if(l>=MAXLV)return{level:MAXLV,cur:Math.max(0,xp-acc),need:xpNeed(MAXLV),max:true};
  return{level:l,cur:xp-acc,need};
}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
// 端末のローカル時刻での通し日数。「何日ぶりか」の判定に使う
function dayNum(t){const d=t||new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*6e4)/864e5);}
function touchStreak(){
  const t=todayStr();if(state.streak.day===t)return;
  const y=new Date(Date.now()-864e5);
  const ys=y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0');
  state.streak.count=(state.streak.day===ys)?state.streak.count+1:1;
  state.streak.day=t;save();
  if(state.streak.count%7===0){toast('🔥 '+state.streak.count+'日連続達成！');grantCard();}
  else if(state.streak.count>=2)toast('🔥 '+state.streak.count+'日連続！');
  checkAch();
}
function addXp(n){
  const before=lvlInfo(state.xp).level;
  state.xp+=n;const after=lvlInfo(state.xp).level;save();
  if(after>before){
    pop(20);setTimeout(()=>toast('🎉 Lv.'+after+'！「'+evoTitle(after).n+'」に到達！'),350);
    if(after%2===0)grantCard();   // 偶数レベルのみ
  }
  checkAch();
}
function unlock(id){
  if(state.ach.includes(id))return;
  state.ach.push(id);save();
  const a=achAll().find(x=>x.id===id);
  setTimeout(()=>toast((isSecret(id)?'🕵️ 隠し実績を発見: ':'🏅 実績解除: ')+(a?a.name:id)),700);
  grantCard();
}
function iboCorrect(){let n=0;Q.forEach(q=>{if(q.lv==='ibo'&&state.stats[q.id])n+=state.stats[q.id].c;});return n;}
function fieldCorrect(f){let n=0;Q.forEach(q=>{if(q.f===f&&state.stats[q.id])n+=state.stats[q.id].c;});return n;}
function lvCorrect(lv){let n=0;Q.forEach(q=>{if(q.lv===lv&&state.stats[q.id])n+=state.stats[q.id].c;});return n;}
function totalCorrect(){let n=0;Object.keys(state.stats).forEach(k=>n+=state.stats[k].c);return n;}
function checkCardMilestone(){
  if(!state.cardMile)state.cardMile=0;
  const marks=[25,60,110,170,240,320,410,510,620,740,870,1010,1160,1320,1490,1670,1860,2060,2270,2490];
  let due=0; marks.forEach(m=>{if(totalCorrect()>=m)due++;});
  while(state.cardMile<due){state.cardMile++;grantCard();}
  save();
}
function checkAch(){
  const solved=Object.keys(state.stats).length;
  const lv=lvlInfo(state.xp).level;
  if((state.calcDone||0)>=10)unlock('calc10');
  if((state.dailyDone||0)>=7)unlock('daily7');
  if((state.dailyDone||0)>=30)unlock('daily30');
  if(state.maxCombo>=5)unlock('combo5');
  if(state.maxCombo>=10)unlock('combo10');
  if(state.maxCombo>=20)unlock('combo20');
  if(solved>=50)unlock('solve50');
  if(solved>=100)unlock('solve100');
  if(solved>=Q.length)unlock('solveall');
  [['phys','phys50'],['chem','chem50'],['bio','bio50'],['earth','earth50']]
    .forEach(([f,id])=>{if(fieldCorrect(f)>=50)unlock(id);});
  if(lvCorrect('hard')>=50)unlock('hard50');
  if(state.taBest>=15)unlock('ta15');
  if(state.taBest>=20)unlock('ta20');
  if(state.taBest>=30)unlock('ta30');
  [[3,'streak3'],[7,'streak7'],[14,'streak14'],[30,'streak30']]
    .forEach(([n,id])=>{if(state.streak.count>=n)unlock(id);});
  [[5,'lv5'],[10,'lv10'],[20,'lv20']].forEach(([n,id])=>{if(lv>=n)unlock(id);});
  const cn=cardsNormal().filter(c=>(state.cardCount||{})[c.id]>0).length;
  if(cn>=10)unlock('cards10');
  if(cn>=30)unlock('cards30');
  if(cn>=50)unlock('cards50');
  if(cn>=cardsNormal().length)unlock('cards34');
  if(CARDS.some(c=>c.r==='H'&&(state.cardCount||{})[c.id]>0))unlock('secret');
  if(!state.stat.fields)state.stat.fields=[];
  if(state.stat.fields.length>=4)unlock('allfield');
  const wk=weak().length;
  if(wk>state.stat.peakWeak)state.stat.peakWeak=wk;
  if(state.stat.peakWeak>=10&&wk===0)unlock('comeback');
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1700)}
function pop(n){const p=document.createElement('div');p.className='pop';const e=['⭐','✨','🎉','💫','🧬'];
  for(let i=0;i<(n||8);i++){const s=document.createElement('span');s.textContent=e[i%5];
    s.style.setProperty('--dx',(Math.random()*260-130)+'px');s.style.setProperty('--dy',(-Math.random()*200-40)+'px');p.appendChild(s)}
  document.body.appendChild(p);setTimeout(()=>p.remove(),820)}
function fieldName(f){const o=FIELDS.find(x=>x[0]===f);return o?o[1]:f}
function pool(field,lv){return Q.filter(q=>(field==='all'||q.f===field)&&(lv==='all'||q.lv===lv))}
function weak(){return Q.filter(q=>{const s=state.stats[q.id];return s&&s.w>0&&s.c<=s.w})}
function rankOf(p){return p>=95?'S':p>=85?'A':p>=70?'B':p>=50?'C':'D'}

async function checkUpdate(silent){
  try{
    const r=await fetch(location.origin+location.pathname+'?c='+Date.now(),{cache:'no-store'});
    const t=await r.text();
    const m=t.match(/const APP_VER='([^']+)'/);
    if(m&&m[1]!==APP_VER){
      const bar=document.getElementById('updBar');
      if(bar){bar.style.display='flex';bar.querySelector('b').textContent='新しいバージョン '+m[1]+' があります';}
      return true;
    }
    if(!silent)toast('最新版です（'+APP_VER+'）');
    return false;
  }catch(e){ if(!silent)toast('確認できませんでした'); return false; }
}

const CALCS=Object.keys(CALC);
function calcName(t){return (CALC[t]||{}).n||t;}
function calcPool(lv){return CALCS.filter(c=>lv==='all'||CALC[c].lv===lv);}
function mkCalc(cat){const o=CALC[cat].mk();o.t=cat;o.f=CALC[cat].f;return o;}
const CALC_N=10, CALC_CAT_MAX=4;
function calcScore(cat,today){
  const s=state.cstat[cat];
  if(!s||(s.c+s.w)===0)return 55;
  const err=s.w/(s.c+s.w);
  const el=Math.max(0,s.d?today-s.d:60);
  return Math.max(5, 20+err*120+Math.min(el,30)*1.5);
}
function buildCalc(){
  const pool=calcPool(curLv);
  if(!pool.length)return [];
  const today=dayNum();
  const w=pool.map(c=>Math.pow(calcScore(c,today),2));
  const used={},list=[];
  for(let i=0;i<CALC_N;i++){
    let tot=0;
    const ww=pool.map((c,k)=>{const v=(used[c]||0)>=CALC_CAT_MAX?0:w[k];tot+=v;return v;});
    if(tot<=0)break;
    let r=Math.random()*tot,cat=pool[0];
    for(let k=0;k<pool.length;k++){r-=ww[k];if(r<=0){cat=pool[k];break;}}
    used[cat]=(used[cat]||0)+1;
    list.push(mkCalc(cat));
  }
  return list;
}
function startCalc(){
  const list=buildCalc();
  if(list.length<3){toast('この難易度の計算問題が足りないよ');return;}
  clearInterval(g.timer);
  g={list:list,i:0,score:0,miss:[],answered:false,combo:0,maxCombo:0,ta:false,t:0,timer:null,
     field:'calc',calc:true,buf:'',t0:Date.now()};
  renderCalc();
}
function renderCalc(){
  if(g.i>=g.list.length)return finishCalc();
  const q=g.list[g.i];
  const cls=g.answered?(calcOk(q,g.buf)?'ansbox ok':'ansbox ng'):'ansbox';
  screen.innerHTML=`
    <button class="back" onclick="quitQuiz()">‹ もどる</button>
    <div class="qhead"><div class="left"><h2>🧮 理科の計算</h2>
      ${g.combo>=2?`<span class="combo">🔥 ${g.combo}コンボ</span>`:''}</div>
      <span class="combo">${g.i+1}/${g.list.length}</span></div>
    <div class="bar-top"><i style="width:${g.i/g.list.length*100}%"></i></div>
    <div class="qcard">
      <div class="qmeta"><span class="tagf">${esc(fieldName(q.f))}</span><span class="taglv ${CALC[q.t].lv}">${LV[CALC[q.t].lv].n}</span></div>
      <div class="qtext">${esc(q.q)}</div>
      <div class="${cls}"><span class="v">${g.buf||(g.answered?'—':'')}</span>${
        g.answered?'':'<span class="cursor"></span>'}<span class="u">${esc(q.u)}</span></div>
    </div>
    ${g.answered?calcFb():calcPad()}`;
}
function calcPad(){
  const k=(v,l,c)=>`<button class="${c||''}" onclick="calcKey('${v}')">${l}</button>`;
  return `<div class="pad">
    ${k('7','7')}${k('8','8')}${k('9','9')}
    ${k('4','4')}${k('5','5')}${k('6','6')}
    ${k('1','1')}${k('2','2')}${k('3','3')}
    ${k('.','・','fn')}${k('0','0')}${k('del','⌫','fn')}</div>
    <button class="btn btn-primary" style="margin-top:10px" onclick="calcKey('go')">こたえる</button>`;
}
function calcOk(q,buf){
  const v=parseFloat(buf);
  if(isNaN(v))return false;
  return Math.abs(v-q.a)<=(q.tol||1e-6);
}
function calcKey(k){
  if(!g||!g.calc||g.answered)return;
  if(k==='del')g.buf=g.buf.slice(0,-1);
  else if(k==='go')return submitCalc();
  else if(k==='.'){ if(g.buf.indexOf('.')<0&&g.buf!=='')g.buf+='.'; }
  else { if(g.buf.replace('.','').length<7)g.buf+=k; }
  renderCalc();
}
function submitCalc(){
  if(!g||g.answered||g.buf===''||g.buf==='.')return;
  g.answered=true;
  const q=g.list[g.i],ok=calcOk(q,g.buf);
  bumpQ();
  if(ok){g.score++;g.combo++;g.maxCombo=Math.max(g.maxCombo,g.combo);
    if(g.combo>state.maxCombo)state.maxCombo=g.combo;
    addXp(XPLV[CALC[q.t].lv]+4+(g.combo>=5?10:g.combo>=3?5:0));touchStreak();
    pop(g.combo>=3?14:8);}
  else{g.combo=0;g.miss.push(q);}
  const cs=state.cstat[q.t]||{c:0,w:0};
  if(ok)cs.c++; else cs.w++;
  cs.d=dayNum(); state.cstat[q.t]=cs;
  save();checkAch();renderCalc();
}
function calcFb(){
  const q=g.list[g.i],ok=calcOk(q,g.buf);
  return `<div class="exp"><b>${ok?'⭕ 正解':'❌ 正解は '+q.a+' '+q.u}</b>　${esc(q.ex)}</div>
    <button class="btn btn-primary" style="margin-top:12px" onclick="nextCalc()">次へ ›</button>`;
}
function nextCalc(){ g.i++; g.answered=false; g.buf=''; renderCalc(); }
function finishCalc(){
  const total=g.list.length,rate=Math.round(g.score/total*100),rk=rankOf(rate);
  const sec=Math.round((Date.now()-g.t0)/1000);
  state.calcDone=(state.calcDone||0)+1;
  unlock('first');
  if(g.score===total&&total>=CALC_N)unlock('calcperfect');
  save();checkAch();
  const per={};
  g.list.forEach(q=>{per[q.t]=per[q.t]||{n:0,ng:0};per[q.t].n++;});
  g.miss.forEach(q=>{if(per[q.t])per[q.t].ng++;});
  const all=Object.keys(per).map(t=>({t:t,n:per[t].n,ok:per[t].n-per[t].ng}))
    .sort((a,b)=>(a.ok/a.n)-(b.ok/b.n));
  const bad=all.filter(r=>r.ok<r.n);
  const show=(bad.length?bad:all).slice(0,6);
  const restN=all.length-show.length;
  const rows=show.map(r=>{const p=r.ok/r.n*100;
    return `<div class="catrow"><span class="cn">${esc(calcName(r.t))}</span>
      <span class="catbar"><i class="${p<50?'bad':p<100?'mid':''}" style="width:${p}%"></i></span>
      <span class="cv">${r.ok}/${r.n}</span></div>`;}).join('')
    +(restN?`<p class="help" style="margin-top:8px">ほか ${restN} 種類は全問正解</p>`:'');
  const miss=g.miss.length?`<div class="label" style="margin-top:4px">まちがえた問題</div>
    <div class="misslist">${g.miss.map(q=>`<div class="r"><div class="q">${esc(q.q)}</div>
      <div class="a">${q.a} ${esc(q.u)}　${esc(q.ex)}</div></div>`).join('')}</div>`:'';
  screen.innerHTML=`
    <button class="back" onclick="renderHome()">‹ もどる</button>
    <div class="result">
      <div class="rank">${rk}</div>
      <div class="big">${g.score}<span style="font-size:22px;color:var(--sub)">/${total}</span></div>
      <h2>${rate===100?'全問正解！':rate>=80?'いい調子！':rate>=50?'ここが伸びしろ':'式から見直そう'}</h2>
      <p>正答率 ${rate}% ／ ${Math.floor(sec/60)}分${String(sec%60).padStart(2,'0')}秒</p>
    </div>
    <div class="label">📊 種類べつ</div>
    <div class="statcard" style="display:block;padding:12px 16px">${rows}</div>
    ${miss}
    <p class="help" style="text-align:center;margin:10px 0 0">計算問題は毎回その場で作られるので、同じ数字は二度と出ない</p>
    <div class="row2" style="margin-top:10px">
      <button class="btn btn-ghost" onclick="renderHome()">ホーム</button>
      <button class="btn btn-primary" onclick="startCalc()">もう一度</button>
    </div>`;
  if(rate>=85)setTimeout(()=>pop(18),200);
}

/* ===================== 今日の10問 =====================
   苦手 → そろそろ忘れそうな問題 → まだ解いていない問題、の順に優先度をつけて
   毎日10問だけ選ぶ。たまった数は表に出さない。                        */
const DAILY_N=10, DAILY_WEAK_MAX=4, DAILY_NEW_MAX=4, DAILY_NEW_MIN=2;
function isNewQ(q){ return !state.stats[q.id]; }
function isWeakQ(q){ const s=state.stats[q.id]; return !!(s&&s.w>0&&s.c<=s.w); }
function ivlOfQ(q){ const s=state.stats[q.id]||{c:0,w:0};
  const k=Math.max(0,Math.min(5,(s.c|0)-(s.w|0)*2)); return [1,2,4,8,16,32][k]; }
function dailyScore(q,today){
  const s=state.stats[q.id];
  let sc;
  if(!s) sc=40;                                              // まだ解いていない
  else{
    const el=s.d?today-s.d:60;                               // 何日ぶりか
    if(isWeakQ(q)) sc=100+Math.min(s.wd?today-s.wd:el,30)*2; // 苦手。まちがえてから日が経つほど上げる
    else{ const due=el-ivlOfQ(q); sc=due>=0?60+Math.min(due,30):15+due; }
  }
  if(s&&s.d===today) sc-=1000;                               // 今日もう解いた問題は最後に回す
  return sc+Math.random()*6;
}
function buildDaily(){
  const all=pool('all',curLv);
  if(all.length<4)return [];
  const today=dayNum();
  const sc=all.map(q=>({q:q,s:dailyScore(q,today)})).sort((a,b)=>b.s-a.s);
  const pick=[],used=new Set();
  let nw=0,nn=0;
  for(const it of sc){                                       // 苦手と新規に上限をつけて配合する
    if(pick.length>=DAILY_N)break;
    if(isWeakQ(it.q)){ if(nw>=DAILY_WEAK_MAX)continue; nw++; }
    else if(isNewQ(it.q)){ if(nn>=DAILY_NEW_MAX)continue; nn++; }
    pick.push(it.q);used.add(it.q.id);
  }
  for(const it of sc){                                       // 足りなければ上限を外して補充
    if(pick.length>=DAILY_N)break;
    if(!used.has(it.q.id)){pick.push(it.q);used.add(it.q.id);}
  }
  let now=pick.filter(isNewQ).length;                        // 新しい問題を最低でも数問は入れる
  if(now<DAILY_NEW_MIN){
    for(const it of sc){
      if(now>=DAILY_NEW_MIN)break;
      if(used.has(it.q.id)||!isNewQ(it.q))continue;
      let k=-1;
      for(let j=pick.length-1;j>=0;j--){ if(!isWeakQ(pick[j])&&!isNewQ(pick[j])){k=j;break;} }
      if(k<0)break;
      used.delete(pick[k].id); pick[k]=it.q; used.add(it.q.id); now++;
    }
  }
  return shuffle(pick).slice(0,DAILY_N);
}
function daily(){
  const t=todayStr();
  const d0=state.daily;
  // まだ1問も解いていないときだけ、レベルの変更で作り直す。
  // 解きはじめたあとにレベルを変えても、その日のぶんの進み具合は残す
  const started=!!d0&&((d0.ok.length+d0.ng.length)>0||d0.fin);
  if(!d0||d0.d!==t||(d0.lv!==curLv&&!started)){
    const l=buildDaily();
    if(!l.length)return null;
    state.daily={d:t,lv:curLv,ids:l.map(q=>q.id),ok:[],ng:[],fin:false};
    save();
  }
  return state.daily;
}
function dailyQs(){
  const d=state.daily; if(!d)return [];
  const m=new Map(Q.map(q=>[q.id,q]));
  return d.ids.map(i=>m.get(i)).filter(Boolean);
}
function dailyCard(){
  const d=daily(); if(!d)return '';
  const tot=d.ids.length,done=d.ok.length+d.ng.length,fin=d.fin||done>=tot;
  let sub,go;
  if(fin){ sub='おわり！ '+d.ok.length+'/'+done+' 正解'; go='もう一度'; }
  else if(done>0){ sub='あと '+(tot-done)+' 問'; go='つづき'; }
  else { sub='苦手と新しい問題をまぜてあるよ'; go='はじめる'; }
  return `<div class="daily${fin?' done':''}" onclick="startDaily()">
      <div class="dic">${fin?'🎉':'☀️'}</div>
      <div class="dbd"><h3>今日の${DAILY_N}問</h3><p>${sub}</p>${
        (done>0&&!fin)?`<div class="dbar"><i style="width:${Math.round(done/tot*100)}%"></i></div>`:''}</div>
      <div class="dgo">${go} ›</div>
    </div>`;
}
function startDaily(){
  const d=daily();
  if(!d){toast('問題がまだ足りないよ');return;}
  const done=new Set(d.ok.concat(d.ng));
  let list=dailyQs().filter(q=>!done.has(q.id));
  if(!list.length)list=dailyQs();            // やり終わっていたら同じ10問でもう一周（記録は据え置き）
  if(!list.length){toast('問題がまだ足りないよ');return;}
  clearInterval(g.timer);
  g={list:list,i:0,score:0,miss:[],answered:false,combo:0,maxCombo:0,ta:false,t:0,timer:null,field:'daily',daily:true};
  renderQuiz();
}
function retryDailyMiss(){
  const list=g.miss.slice();
  if(!list.length){renderHome();return;}
  g={list:list,i:0,score:0,miss:[],answered:false,combo:0,maxCombo:0,ta:false,t:0,timer:null,field:'daily',daily:true};
  renderQuiz();
}
function finishDaily(){
  clearInterval(g.timer);
  const d=state.daily,total=g.list.length,rate=Math.round(g.score/total*100),rk=rankOf(rate);
  const alldone=!!d&&(d.ok.length+d.ng.length)>=d.ids.length;
  if(alldone&&d&&!d.fin){ d.fin=true; state.dailyDone=(state.dailyDone||0)+1; save(); }
  unlock('first');
  if(total>=DAILY_N&&g.score===total)unlock('perfect');
  checkAch();
  const msg=rate===100?'全問正解！かんぺき':rate>=80?'いい調子！':rate>=50?'ここが伸びしろ':'今日のぶん、やりきったね';
  const miss=g.miss.length?`<div class="label" style="margin-top:4px">まちがえた問題（明日また出るよ）</div>
    <div class="misslist">${g.miss.map(q=>`<div class="r"><div class="q">${esc(q.q)}</div><div class="a">正解: ${esc(q.ch[q.a])}</div></div>`).join('')}</div>`:'';
  screen.innerHTML=`
    <button class="back" onclick="renderHome()">‹ もどる</button>
    <div class="result">
      <div class="rank">${rk}</div>
      <div class="big">${g.score}<span style="font-size:22px;color:var(--sub)">/${total}</span></div>
      <h2>${msg}</h2>
      <p>${alldone?'今日のぶんは完了':'あと '+Math.max(0,d.ids.length-(d.ok.length+d.ng.length))+' 問'}${
        state.streak.count>=2?' ／ 🔥'+state.streak.count+'日連続':''}</p>
    </div>
    ${miss}
    <p class="help" style="text-align:center;margin:10px 0 0">明日はまた新しい${DAILY_N}問が出るよ</p>
    <div class="row2" style="margin-top:10px">
      <button class="btn btn-ghost" onclick="renderHome()">ホーム</button>
      ${g.miss.length?`<button class="btn btn-primary" onclick="retryDailyMiss()">まちがえた ${g.miss.length} 問をもう一度</button>`
                     :`<button class="btn btn-primary" onclick="startDaily()">もう一度</button>`}
    </div>`;
  if(rate>=85)setTimeout(()=>pop(18),200);
}

function startQuiz(field,ta){
  let list;
  if(field==='weak'){list=shuffle(weak());if(!list.length){toast('苦手はまだないよ');return;}list=list.slice(0,10);}
  else{list=pool(field,curLv);
    if(list.length<4){toast('この条件の問題が足りないよ');return;}
    list=shuffle(list).slice(0,ta?40:10);}
  g={list,i:0,score:0,miss:[],answered:false,combo:0,maxCombo:0,ta:!!ta,t:ta?60:0,timer:null,field};
  renderQuiz();
}
function renderQuiz(){
  if(g.i>=g.list.length)return finish();
  clearInterval(g.timer);
  const q=g.list[g.i];g.answered=false;
  const opts=shuffle(q.ch.map((c,k)=>({c,k})));
  screen.innerHTML=`
    <button class="back" onclick="quitQuiz()">‹ もどる</button>
    <div class="qhead"><div class="left"><h2>${g.ta?'⏱ タイムアタック':'📝 クイズ'}</h2>
      ${g.combo>=2?`<span class="combo">🔥 ${g.combo}コンボ</span>`:''}</div>
      ${g.ta?`<span class="timer" id="tm">${g.t}</span>`:`<span class="combo">${g.i+1}/${g.list.length}</span>`}</div>
    <div class="bar-top"><i style="width:${g.i/g.list.length*100}%"></i></div>
    <div class="qcard">
      <div class="qmeta"><span class="tagf">${esc(fieldName(q.f))}</span><span class="taglv ${q.lv}">${LV[q.lv].n}</span></div>
      <div class="qtext">${esc(q.q)}</div>
    </div>
    <div class="choices">${opts.map(o=>`<button class="choice" data-k="${o.k}" onclick="answer(${o.k})">${esc(o.c)}</button>`).join('')}</div>
    <div id="fb"></div>`;
  if(g.ta){g.timer=setInterval(()=>{g.t--;const el=$('tm');
    if(el){el.textContent=g.t;if(g.t<=5)el.classList.add('warn');}
    if(g.t<=0){clearInterval(g.timer);g.answered=true;finish();}},1000);}
}
function answer(k){
  if(g.answered)return;g.answered=true;clearInterval(g.timer);
  const q=g.list[g.i],ok=k===q.a;
  document.querySelectorAll('.choice').forEach(b=>{const kk=+b.dataset.k;
    if(kk===q.a)b.classList.add('correct');else if(kk===k)b.classList.add('wrong');else b.classList.add('dim');b.onclick=null;});
  const st=state.stats[q.id]||{c:0,w:0};
  bumpQ();
  if(ok)setTimeout(checkCardMilestone,50);
  if(!state.stat.fields)state.stat.fields=[];
  if(!state.stat.fields.includes(q.f)){state.stat.fields.push(q.f);}
  if(ok){g.score++;g.combo++;g.maxCombo=Math.max(g.maxCombo,g.combo);
    if(g.combo>state.maxCombo)state.maxCombo=g.combo;
    st.c++;
    addXp(XPLV[q.lv]+(g.combo>=5?10:g.combo>=3?5:0));touchStreak();
    pop(g.combo>=3?14:8);}
  else{g.combo=0;g.miss.push(q);st.w++;}
  st.d=dayNum(); if(!ok)st.wd=st.d;
  if(g.daily&&state.daily&&!state.daily.ok.includes(q.id)&&!state.daily.ng.includes(q.id))
    (ok?state.daily.ok:state.daily.ng).push(q.id);
  state.stats[q.id]=st;save();
  const head=k===-1?'⏰ 時間切れ':(ok?'⭕ 正解':'❌ 不正解');
  $('fb').innerHTML=`<div class="exp"><b>${head}</b>　${esc(q.ex)}</div>
    <button class="btn btn-primary" style="margin-top:12px" onclick="next()">次へ ›</button>`;
  $('fb').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function next(){g.i++;renderQuiz();}
function quitQuiz(){clearInterval(g.timer);renderHome();}
function finish(){
  if(g.daily)return finishDaily();
  clearInterval(g.timer);
  const total=g.list.length,rate=Math.round(g.score/total*100),rk=rankOf(rate);
  const key=(g.field||'all')+'_'+curLv+(g.ta?'_ta':'');
  const prev=state.best[key]||0;const isBest=g.score>prev;
  if(isBest){state.best[key]=g.score;save();}
  unlock('first');
  if(g.ta&&g.score>state.taBest){state.taBest=g.score;save();}
  if(!g.ta&&total>=10&&g.score===total)unlock('perfect');
  checkAch();
  const msg={S:'完璧！文句なし',A:'すばらしい理解度',B:'いい調子、あと少し',C:'解説を読んで固めよう',D:'まずは易しめから'}[rk];
  const miss=g.miss.length?`<div class="label" style="margin-top:4px">まちがえた問題</div>
    <div class="misslist">${g.miss.map(q=>`<div class="r"><div class="q">${esc(q.q)}</div><div class="a">正解: ${esc(q.ch[q.a])}</div></div>`).join('')}</div>`:'';
  screen.innerHTML=`
    <button class="back" onclick="renderHome()">‹ もどる</button>
    <div class="result">
      <div class="rank">${rk}</div>
      <div class="big">${g.score}<span style="font-size:22px;color:var(--sub)">/${total}</span></div>
      <h2>${msg}</h2>
      <p>正答率 ${rate}% ／ 最大 ${g.maxCombo} コンボ</p>
      ${isBest?'<p style="color:var(--accent);font-weight:800">🏅 自己ベスト更新！</p>':`<p>この条件のベスト: ${Math.max(prev,g.score)}問</p>`}
    </div>
    ${miss}
    <div class="row2" style="margin-top:8px">
      <button class="btn btn-ghost" onclick="renderHome()">ホーム</button>
      <button class="btn btn-primary" onclick="startQuiz('${g.field}',${g.ta})">もう一回</button>
    </div>`;
  if(rate>=85)setTimeout(()=>pop(18),200);
}
renderHome();
setTimeout(()=>checkUpdate(true),1500);
</script>
